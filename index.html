<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wedding Message</title>

  <style>

    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f7f5ef;
      color: #343434;
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      overflow-x: hidden;
    }


    /* =========================
       全体
    ========================= */

    .page {
      width: 100%;
      min-height: 100vh;
      background: #f7f5ef;
    }


    /* =========================
       FILM SECTION
    ========================= */

    .film-section {
      width: 100%;
      height: 52vh;
      min-height: 430px;
      max-height: 570px;

      background: #242424;

      position: relative;
      overflow: hidden;

      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
    }


    /* フィルム上下のライン */

    .film-strip {
      position: absolute;
      left: 0;
      width: 100%;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: space-around;

      padding: 0 8px;

      background: #242424;

      z-index: 10;
    }

    .film-strip.top {
      top: 0;
      border-bottom: 1px solid #555;
    }

    .film-strip.bottom {
      bottom: 0;
      border-top: 1px solid #555;
    }


    /* フィルムの四角い穴 */

    .film-hole {
      width: 36px;
      height: 18px;

      background: #f7f5ef;

      border-radius: 4px;

      flex-shrink: 0;
    }


    /* =========================
       写真エリア
    ========================= */

    .photo-window {
      position: absolute;

      top: 55px;
      bottom: 55px;

      left: 0;
      right: 0;

      overflow: hidden;
    }


    .photo-track {
      height: 100%;

      display: flex;
      align-items: center;
      gap: 34px;

      width: max-content;

      animation: filmMove 18s linear infinite;
    }


    .photo-item {
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }


    .photo-item img {
      display: block;

      max-height: 100%;
      max-width: none;

      object-fit: contain;

      box-shadow: none;
      border-radius: 0;
    }


    /* 1枚目・3枚目 */
    .photo-item.small img {
      height: 72%;
    }


    /* 真ん中の写真を少し大きく */
    .photo-item.large img {
      height: 92%;
    }


    /* 横方向にゆっくり流れる */

    @keyframes filmMove {

      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-420px);
      }

    }


    /* =========================
       MESSAGE SECTION
    ========================= */

    .message-section {
      width: 100%;

      padding: 24px 20px 28px;

      background: #f7f5ef;

      position: relative;
    }


    /* 上の小さなフィルムライン */

    .message-film-line {
      width: 100%;
      height: 12px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      overflow: hidden;

      margin-bottom: 12px;
    }

    .message-film-dot {
      width: 12px;
      height: 5px;

      border-radius: 50%;

      background: #bdb9af;

      flex-shrink: 0;
    }


    /* =========================
       メッセージカード
    ========================= */

    .message-card {
      width: 100%;
      max-width: 650px;

      margin: 0 auto;

      background: #faf9f4;

      border: 1.5px solid #aaa397;

      position: relative;

      padding: 24px 28px 18px;

      display: flex;
      flex-direction: column;

      /*
        ここでカード全体の高さを
        ある程度固定。
        下のデザインが必ず見えるようにする。
      */

      height: 48vh;
      min-height: 390px;
      max-height: 520px;
    }


    /* 内側の二重線 */

    .message-card::before {
      content: "";

      position: absolute;

      top: 10px;
      bottom: 10px;
      left: 10px;
      right: 10px;

      border: 1px solid #c5bfb2;

      pointer-events: none;
    }


    /* 四隅の装飾 */

    .corner {
      position: absolute;

      width: 34px;
      height: 34px;

      background: #faf9f4;

      z-index: 3;
    }


    .corner.tl {
      top: -1px;
      left: -1px;

      border-right: 1px solid #aaa397;
      border-bottom: 1px solid #aaa397;

      border-radius: 0 0 34px 0;
    }

    .corner.tr {
      top: -1px;
      right: -1px;

      border-left: 1px solid #aaa397;
      border-bottom: 1px solid #aaa397;

      border-radius: 0 0 0 34px;
    }

    .corner.bl {
      bottom: -1px;
      left: -1px;

      border-right: 1px solid #aaa397;
      border-top: 1px solid #aaa397;

      border-radius: 0 34px 0 0;
    }

    .corner.br {
      bottom: -1px;
      right: -1px;

      border-left: 1px solid #aaa397;
      border-top: 1px solid #aaa397;

      border-radius: 34px 0 0 0;
    }


    /* 左右のチケット切り欠き */

    .side-cut {
      position: absolute;

      width: 28px;
      height: 56px;

      top: 50%;

      transform: translateY(-50%);

      background: #f7f5ef;

      border: 1px solid #aaa397;

      z-index: 4;
    }

    .side-cut.left {
      left: -15px;
      border-radius: 0 28px 28px 0;
      border-left: none;
    }

    .side-cut.right {
      right: -15px;
      border-radius: 28px 0 0 28px;
      border-right: none;
    }


    /* =========================
       上部タイトル
    ========================= */

    .message-header {
      flex-shrink: 0;

      position: relative;
      z-index: 5;
    }


    .guest-label {
      font-family:
        "Times New Roman",
        serif;

      font-size: 11px;

      letter-spacing: 3px;

      color: #817b70;

      margin-bottom: 14px;
    }


    .guest-name {
      margin: 0;

      font-size: 30px;

      font-weight: 400;

      letter-spacing: 2px;

      line-height: 1.35;
    }


    .name-line {
      width: 95px;
      height: 2px;

      background: #aaa397;

      margin-top: 10px;
    }


    /* =========================
       メッセージ本文
    ========================= */

    .message-body {
      position: relative;
      z-index: 5;

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 24px 4px 10px 4px;

      scrollbar-width: thin;
      scrollbar-color: #b7b0a3 transparent;
    }


    .message-body::-webkit-scrollbar {
      width: 4px;
    }

    .message-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .message-body::-webkit-scrollbar-thumb {
      background: #b7b0a3;
      border-radius: 10px;
    }


    .message-text {
      margin: 0;

      font-size: 18px;

      line-height: 2.15;

      letter-spacing: 1px;

      white-space: pre-wrap;
    }


    /* =========================
       フッター
    ========================= */

    .message-footer {
      position: relative;
      z-index: 5;

      flex-shrink: 0;

      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: end;

      gap: 10px;

      padding-top: 8px;
    }


    .footer-left,
    .footer-right {

      font-family:
        "Times New Roman",
        serif;

      font-size: 10px;

      letter-spacing: 2px;

      color: #807a70;

      line-height: 1.7;
    }


    .footer-right {
      text-align: right;
    }


    .heart {
      font-size: 18px;

      color: #a69d8d;

      padding-bottom: 2px;
    }


    /* =========================
       スマホ調整
    ========================= */

    @media (max-width: 600px) {

      .film-section {
        height: 50vh;
        min-height: 420px;
      }


      .film-strip {
        height: 30px;
      }


      .film-hole {
        width: 34px;
        height: 17px;
      }


      .photo-window {
        top: 48px;
        bottom: 48px;
      }


      .photo-track {
        gap: 30px;
      }


      .photo-item.small img {
        height: 72%;
      }


      .photo-item.large img {
        height: 90%;
      }


      .message-section {
        padding: 20px 20px 24px;
      }


      .message-card {
        height: 49vh;

        min-height: 380px;

        padding:
          24px
          28px
          16px;
      }


      .guest-label {
        font-size: 10px;
        letter-spacing: 2.5px;
      }


      .guest-name {
        font-size: 27px;
      }


      .message-body {
        padding-top: 22px;
      }


      .message-text {
        font-size: 17px;

        line-height: 2.05;

        letter-spacing: 0.8px;
      }


      .footer-left,
      .footer-right {
        font-size: 9px;
        letter-spacing: 1.5px;
      }

    }


  </style>
</head>


<body>

<div class="page">


  <!-- =========================
       FILM
  ========================== -->

  <section class="film-section">


    <!-- 上のフィルム穴 -->

    <div class="film-strip top">

      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>

    </div>


    <!-- 写真 -->

    <div class="photo-window">

      <div class="photo-track">

        <div class="photo-item small">
          <img id="photo1" src="" alt="">
        </div>

        <div class="photo-item large">
          <img id="photo2" src="" alt="">
        </div>

        <div class="photo-item small">
          <img id="photo3" src="" alt="">
        </div>

        <!-- ループ用 -->

        <div class="photo-item small">
          <img id="photo1-copy" src="" alt="">
        </div>

        <div class="photo-item large">
          <img id="photo2-copy" src="" alt="">
        </div>

        <div class="photo-item small">
          <img id="photo3-copy" src="" alt="">
        </div>

      </div>

    </div>


    <!-- 下のフィルム穴 -->

    <div class="film-strip bottom">

      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>
      <div class="film-hole"></div>

    </div>

  </section>



  <!-- =========================
       MESSAGE
  ========================== -->

  <section class="message-section">


    <!-- 小さなフィルムライン -->

    <div class="message-film-line">

      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>
      <div class="message-film-dot"></div>

    </div>



    <!-- メッセージカード -->

    <div class="message-card">


      <!-- 四隅 -->

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>


      <!-- 左右の切り欠き -->

      <div class="side-cut left"></div>
      <div class="side-cut right"></div>



      <!-- ヘッダー -->

      <div class="message-header">

        <div class="guest-label">
          TO OUR GUEST
        </div>

        <h1 class="guest-name" id="name">
          Welcome!
        </h1>

        <div class="name-line"></div>

      </div>



      <!-- 本文だけスクロール -->

      <div class="message-body">

        <p class="message-text" id="message">
          メッセージを読み込んでいます。
        </p>

      </div>



      <!-- フッター -->

      <div class="message-footer">

        <div class="footer-left">
          RIN & RIN<br>
          WEDDING
        </div>

        <div class="heart">
          ♥
        </div>

        <div class="footer-right">
          THANK YOU FOR<br>
          CELEBRATING WITH US
        </div>

      </div>


    </div>

  </section>

</div>



<!-- =========================
     GUEST DATA
========================== -->

<script src="guests.js"></script>


<script>

  const params =
    new URLSearchParams(window.location.search);

  const id =
    params.get("id");


  if (id && guests[id]) {

    const guest = guests[id];


    /* 名前 */

    document.getElementById("name").textContent =
      `${guest.name}へ`;


    /* メッセージ */

    document.getElementById("message").textContent =
      guest.message;


    /* 写真 */

    const photos = guest.photos || [];


    const photo1 =
      photos[0] || "";

    const photo2 =
      photos[1] || photos[0] || "";

    const photo3 =
      photos[2] || photos[0] || "";


    document.getElementById("photo1").src =
      photo1;

    document.getElementById("photo2").src =
      photo2;

    document.getElementById("photo3").src =
      photo3;


    document.getElementById("photo1-copy").src =
      photo1;

    document.getElementById("photo2-copy").src =
      photo2;

    document.getElementById("photo3-copy").src =
      photo3;


  } else {


    document.getElementById("name").textContent =
      "Welcome!";


    document.getElementById("message").textContent =
      "QRコードからアクセスしてください。";

  }

</script>


</body>
</html>
