



<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Memory Ticket</title>


  <!-- ================================
       Google Fonts
  ================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Libre+Baskerville:wght@400;700&family=Noto+Serif+JP:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ==================================================
       基本設定
    ================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        #f5f1e7;

      color:
        #30302d;

    }


    body {

      font-family:
        "Noto Serif JP",
        serif;

      -webkit-font-smoothing:
        antialiased;

    }


    /* ==================================================
       ページ本体
    ================================================== */

    .page {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

      background:
        #f7f3e9;

    }


    /* ==================================================
       外側のチケットフレーム
       ※ フィルムより前面に表示
    ================================================== */

    .ticket-frame {

      position: absolute;

      inset: 11px;

      border:
        1px solid
        rgba(112, 91, 57, 0.55);

      pointer-events:
        none;

      z-index:
        100;

    }


    .ticket-frame::before {

      content: "";

      position: absolute;

      inset: 7px;

      border:
        1px solid
        rgba(112, 91, 57, 0.28);

    }


    /* ==================================================
       四隅の丸み
       ※ フィルムより確実に前面
    ================================================== */

    .corner {

      position: absolute;

      width: 22px;
      height: 22px;

      background:
        #f7f3e9;

      border:
        1px solid
        rgba(112, 91, 57, 0.55);

      z-index:
        100;

    }


    .corner.tl {

      top: -1px;
      left: -1px;

      border-radius:
        0 0 21px 0;

      border-top:
        none;

      border-left:
        none;

    }


    .corner.tr {

      top: -1px;
      right: -1px;

      border-radius:
        0 0 0 21px;

      border-top:
        none;

      border-right:
        none;

    }


    .corner.bl {

      bottom: -1px;
      left: -1px;

      border-radius:
        0 21px 0 0;

      border-bottom:
        none;

      border-left:
        none;

    }


    .corner.br {

      bottom: -1px;
      right: -1px;

      border-radius:
        21px 0 0 0;

      border-bottom:
        none;

      border-right:
        none;

    }


    /* ==================================================
       メインコンテンツ
    ================================================== */

    .content {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    /* ==================================================
       上部：フィルムエリア
    ================================================== */

    .film-section {

      position: relative;

      width: 100%;

      height: 50%;

      min-height: 310px;

      overflow: hidden;

      background:
        #252624;

      border-bottom:
        1px solid
        rgba(65, 61, 53, 0.4);

    }


    /* ==================================================
       フィルム上下の穴
    ================================================== */

    .film-holes {

      position: absolute;

      left: 0;
      right: 0;

      height: 17px;

      z-index: 20;

      display: flex;

      align-items: center;

      justify-content: space-around;

      overflow: hidden;

      pointer-events:
        none;

    }


    .film-holes.top {

      top: 8px;

    }


    .film-holes.bottom {

      bottom: 8px;

    }


    .film-hole {

      flex:
        0 0 13px;

      height: 9px;

      border-radius:
        2px;

      background:
        #f7f3e9;

      opacity:
        0.92;

    }


    /* ==================================================
       フィルム内側のライン
    ================================================== */

    .film-line {

      position: absolute;

      left: 0;
      right: 0;

      height: 1px;

      background:
        rgba(245, 241, 231, 0.18);

      z-index: 15;

    }


    .film-line.top {

      top: 35px;

    }


    .film-line.bottom {

      bottom: 35px;

    }


    /* ==================================================
       写真トラック
    ================================================== */

    .photo-window {

      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 72%;

      transform:
        translateY(-50%);

      overflow: hidden;

      z-index: 10;

      touch-action:
        pan-y;

    }


    .photo-track {

      position: absolute;

      top: 50%;
      left: 0;

      height: 100%;

      display: flex;

      align-items: center;

      gap: 18px;

      width: max-content;

      transform:
        translate3d(
          0,
          -50%,
          0
        );

      will-change:
        transform;

      user-select:
        none;

      -webkit-user-select:
        none;

      cursor:
        grab;

    }


    .photo-track.dragging {

      cursor:
        grabbing;

    }


    /* ==================================================
       写真
    ================================================== */

    .photo-card {

      position: relative;

      flex:
        0 0 auto;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .photo-card img {

      display: block;

      height: 100%;

      width: auto;

      max-width:
        61vw;

      object-fit:
        contain;

      border-radius:
        2px;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.22);

      pointer-events:
        none;

      -webkit-user-drag:
        none;

    }


    /* ==================================================
       フィルム中央の小さなマーク
    ================================================== */

    .film-mark {

      display:
        none;

    }


    /* ==================================================
       下部メッセージエリア
    ================================================== */

    .message-section {

      position: relative;

      width: 100%;

      height: 50%;

      padding:
        27px 35px 18px;

      background:
        #f7f3e9;

      overflow:
        hidden;

    }


    /* ==================================================
       メッセージ上部装飾
    ================================================== */

    .ornament-top {

      position: absolute;

      top: 7px;

      left: 50%;

      transform:
        translateX(-50%);

      width: 150px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      color:
        rgba(126, 103, 66, 0.6);

      font-family:
        Georgia,
        serif;

      font-size:
        14px;

    }


    .ornament-top::before,
    .ornament-top::after {

      content: "";

      height: 1px;

      flex: 1;

      background:
        rgba(126, 103, 66, 0.4);

    }


    /* ==================================================
       チケット風メッセージカード
    ================================================== */

    .message-card {

      position: relative;

      width: 100%;
      height: 100%;

      border:
        1px solid
        rgba(112,91,57,0.62);

      padding:
        20px 24px 16px;

      overflow: hidden;

      background:
        rgba(250,247,239,0.88);

    }


    .message-card::before {

      content: "";

      position: absolute;

      inset: 5px;

      border:
        1px solid
        rgba(112,91,57,0.27);

      pointer-events:
        none;

    }


    /* ==================================================
       チケット左右の切り欠き
    ================================================== */

    .notch {

      position: absolute;

      width: 34px;
      height: 34px;

      border-radius:
        50%;

      background:
        #f7f3e9;

      border:
        1px solid
        rgba(112,91,57,0.55);

      z-index: 5;

    }


    .notch.left {

      left: -18px;
      top: 50%;

      transform:
        translateY(-50%);

    }


    .notch.right {

      right: -18px;
      top: 50%;

      transform:
        translateY(-50%);

    }


    /* ==================================================
       上部の小さな文字
       ※ TO OUR GUEST は削除
    ================================================== */

    .eyebrow {

      display:
        none;

    }


    /* ==================================================
       宛名
    ================================================== */

    .guest-name {

      position: relative;

      z-index: 3;

      margin:
        0;

      font-family:
        "Klee One",
        cursive;

      font-size:
        23px;

      font-weight:
        600;

      letter-spacing:
        0.08em;

      line-height:
        1.5;

      color:
        #30302d;

    }


    /* ==================================================
       宛名下ライン
    ================================================== */

    .name-line {

      position: relative;

      z-index: 3;

      width: 52px;

      height: 1px;

      margin:
        7px 0 14px;

      background:
        rgba(82,67,44,0.55);

    }


    /* ==================================================
       メッセージスクロール
    ================================================== */

    .message-scroll {

      position: relative;

      z-index: 3;

      height:
        calc(100% - 105px);

      overflow-y:
        auto;

      padding-right:
        5px;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width:
        none;

    }


    .message-scroll::-webkit-scrollbar {

      display:
        none;

    }


    /* ==================================================
       本文
    ================================================== */

    .message {

      margin:
        0;

      padding-bottom:
        20px;

      font-family:
        "Klee One",
        "Noto Serif JP",
        serif;

      font-size:
        14px;

      line-height:
        2.05;

      letter-spacing:
        0.045em;

      white-space:
        pre-line;

      color:
        #3c3a36;

    }


    /* ==================================================
       下部装飾
    ================================================== */

    .message-bottom {

      position: absolute;

      left: 24px;
      right: 24px;

      bottom: 14px;

      z-index: 4;

      display: flex;

      align-items: flex-end;

      justify-content: space-between;

    }


    .wedding-mark {

      font-family:
        "Libre Baskerville",
        serif;

      font-size:
        7px;

      line-height:
        1.8;

      letter-spacing:
        0.17em;

      color:
        rgba(91,73,44,0.68);

    }


    .thank-you {

      font-family:
        "Libre Baskerville",
        serif;

      font-size:
        7px;

      line-height:
        1.7;

      letter-spacing:
        0.13em;

      text-align:
        right;

      color:
        rgba(91,73,44,0.65);

    }


    /* ==================================================
       下部の点線
    ================================================== */

    .bottom-dash {

      position: absolute;

      left: 24px;
      right: 24px;

      bottom: 5px;

      height: 1px;

      background:
        repeating-linear-gradient(
          to right,
          rgba(126,103,66,0.45) 0,
          rgba(126,103,66,0.45) 8px,
          transparent 8px,
          transparent 15px
        );

      z-index: 4;

    }


    /* ==================================================
       小さな装飾
    ================================================== */

    .little-heart {

      position: absolute;

      left: 50%;

      bottom: 13px;

      transform:
        translateX(-50%);

      z-index: 6;

      color:
        rgba(126,103,66,0.58);

      font-size:
        11px;

    }


    /* ==================================================
       スマホ小画面対応
    ================================================== */

    @media (max-height: 700px) {


      .film-section {

        min-height:
          280px;

      }


      .message-section {

        padding:
          23px 31px 15px;

      }


      .message-card {

        padding:
          17px 21px 13px;

      }


      .guest-name {

        font-size:
          21px;

      }


      .message {

        font-size:
          13px;

        line-height:
          1.95;

      }


      .eyebrow {

        margin-bottom:
          5px;

      }


      .name-line {

        margin:
          5px 0 10px;

      }

    }


    /* ==================================================
       PC対応
    ================================================== */

    @media (min-width: 700px) {


      body {

        padding:
          20px 0;

      }


      .page {

        height:
          850px;

        border-radius:
          12px;

        box-shadow:
          0 15px 50px
          rgba(0,0,0,0.15);

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- 外側フレーム -->

    <div class="ticket-frame">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>


    <div class="content">


      <!-- =================================================
           写真・フィルムエリア
      ================================================== -->

      <section class="film-section">


        <!-- 上側フィルム穴 -->

        <div
          class="film-holes top"
          id="holesTop"
        ></div>


        <!-- 下側フィルム穴 -->

        <div
          class="film-holes bottom"
          id="holesBottom"
        ></div>


        <!-- フィルムライン -->

        <div class="film-line top"></div>

        <div class="film-line bottom"></div>


        <!-- 写真表示領域 -->

        <div
          class="photo-window"
          id="photoWindow"
        >

          <div
            class="photo-track"
            id="photoTrack"
          >


            <!-- 写真1 -->

            <div class="photo-card">

              <img
                id="photo1"
                src=""
                alt=""
              >

            </div>


            <!-- 写真2 -->

            <div class="photo-card">

              <img
                id="photo2"
                src=""
                alt=""
              >

            </div>


            <!-- 写真3 -->

            <div class="photo-card">

              <img
                id="photo3"
                src=""
                alt=""
              >

            </div>


            <!-- コピー -->

            <div class="photo-card">

              <img
                id="photo1copy"
                src=""
                alt=""
              >

            </div>


            <div class="photo-card">

              <img
                id="photo2copy"
                src=""
                alt=""
              >

            </div>


            <div class="photo-card">

              <img
                id="photo3copy"
                src=""
                alt=""
              >

            </div>


          </div>

        </div>


      </section>


      <!-- =================================================
           メッセージエリア
      ================================================== -->

      <section class="message-section">


        <!-- 上部装飾 -->

        <div class="ornament-top">
          ✦
        </div>


        <!-- チケットカード -->

        <div class="message-card">


          <!-- 左右切り欠き -->

          <div class="notch left"></div>

          <div class="notch right"></div>


          <!-- 宛名 -->

          <h1
            id="name"
            class="guest-name"
          >
            Thank you!
          </h1>


          <!-- ライン -->

          <div class="name-line"></div>


          <!-- メッセージ -->

          <div
            class="message-scroll"
            id="messageScroll"
          >

            <p
              id="message"
              class="message"
            >
              メッセージを読み込んでいます。
            </p>

          </div>


          <!-- 下部情報 -->

          <div class="message-bottom">


            <div class="wedding-mark">

              RIN & RIN<br>
              WEDDING

            </div>


            <div class="thank-you">

              THANK YOU FOR<br>
              CELEBRATING WITH US

            </div>


          </div>


          <!-- ハート -->

          <div class="little-heart">
            ♥
          </div>


          <!-- 点線 -->

          <div class="bottom-dash"></div>


        </div>


      </section>


    </div>


  </main>


  <!-- ==================================================
       ゲストデータ
  ================================================== -->

  <script src="guests.js"></script>


  <script>


    /* ==================================================
       URLからID取得
    ================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* ==================================================
       フィルム穴生成
    ================================================== */

    function createFilmHoles() {


      const top =
        document.getElementById(
          "holesTop"
        );


      const bottom =
        document.getElementById(
          "holesBottom"
        );


      const count =
        Math.ceil(
          window.innerWidth / 23
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {


        const hole1 =
          document.createElement(
            "div"
          );

        hole1.className =
          "film-hole";


        const hole2 =
          document.createElement(
            "div"
          );

        hole2.className =
          "film-hole";


        top.appendChild(
          hole1
        );

        bottom.appendChild(
          hole2
        );

      }

    }


    createFilmHoles();


    /* ==================================================
       写真を設定
    ================================================== */

    function setPhoto(
      id,
      src
    ) {


      const image =
        document.getElementById(
          id
        );


      if (!image) {

        return;

      }


      if (src) {

        image.src =
          src;

      } else {

        image.parentElement.style.display =
          "none";

      }

    }


    /* ==================================================
       ゲスト情報
    ================================================== */

    if (
      id &&
      typeof guests !== "undefined" &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* 名前 */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* メッセージ */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* 写真 */

      setPhoto(
        "photo1",
        guest.photos[0]
      );


      setPhoto(
        "photo2",
        guest.photos[1]
      );


      setPhoto(
        "photo3",
        guest.photos[2]
      );


      /* コピー */

      setPhoto(
        "photo1copy",
        guest.photos[0]
      );


      setPhoto(
        "photo2copy",
        guest.photos[1]
      );


      setPhoto(
        "photo3copy",
        guest.photos[2]
      );


    } else {


      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


    }


    /* ==================================================
       写真自動スクロール
    ================================================== */

    const track =
      document.getElementById(
        "photoTrack"
      );


    const windowArea =
      document.getElementById(
        "photoWindow"
      );


    let position = 0;


    let velocity =
        0.38;


    let dragging =
        false;


    let startX =
        0;


    let startPosition =
        0;


    /* ==================================================
       1セット分の幅
    ================================================== */

    function getLoopWidth() {


      const cards =
        track.querySelectorAll(
          ".photo-card"
        );


      if (
        cards.length < 4
      ) {

        return 0;

      }


      return (
        cards[3].offsetLeft -
        cards[0].offsetLeft
      );

    }


    /* ==================================================
       アニメーション
    ================================================== */

    function animate() {


      const loopWidth =
        getLoopWidth();


      if (
        !dragging &&
        loopWidth
      ) {

        position -=
          velocity;


        if (
          position <=
          -loopWidth
        ) {

          position +=
            loopWidth;

        }

      }


      track.style.transform =
        `translate3d(
          ${position}px,
          -50%,
          0
        )`;


      requestAnimationFrame(
        animate
      );

    }


    requestAnimationFrame(
      animate
    );


    /* ==================================================
       タッチ操作
    ================================================== */

    windowArea.addEventListener(
      "touchstart",
      function(event) {


        if (
          event.touches.length !== 1
        ) {

          return;

        }


        dragging =
          true;


        track.classList.add(
          "dragging"
        );


        startX =
          event.touches[0].clientX;


        startPosition =
          position;


      },
      {
        passive: true
      }
    );


    windowArea.addEventListener(
      "touchmove",
      function(event) {


        if (!dragging) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const delta =
          currentX -
          startX;


        position =
          startPosition +
          delta;


        const loopWidth =
          getLoopWidth();


        if (
          loopWidth &&
          position <= -loopWidth
        ) {

          position +=
            loopWidth;

          startPosition +=
            loopWidth;

        }


        if (
          loopWidth &&
          position > 0
        ) {

          position -=
            loopWidth;

          startPosition -=
            loopWidth;

        }

      },
      {
        passive: true
      }
    );


    windowArea.addEventListener(
      "touchend",
      function() {


        dragging =
          false;


        track.classList.remove(
          "dragging"
        );

      }
    );


    /* ==================================================
       PCマウス操作
    ================================================== */

    windowArea.addEventListener(
      "mousedown",
      function(event) {


        dragging =
          true;


        track.classList.add(
          "dragging"
        );


        startX =
          event.clientX;


        startPosition =
          position;

      }
    );


    window.addEventListener(
      "mousemove",
      function(event) {


        if (!dragging) {

          return;

        }


        position =
          startPosition +
          (
            event.clientX -
            startX
          );


        const loopWidth =
          getLoopWidth();


        if (
          loopWidth &&
          position <= -loopWidth
        ) {

          position +=
            loopWidth;

          startPosition +=
            loopWidth;

        }


        if (
          loopWidth &&
          position > 0
        ) {

          position -=
            loopWidth;

          startPosition -=
            loopWidth;

        }

      }
    );


    window.addEventListener(
      "mouseup",
      function() {


        dragging =
          false;


        track.classList.remove(
          "dragging"
        );

      }
    );


  </script>


</body>

</html>
