<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Message</title>


  <!-- =====================================
       手書き風フォント
  ====================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
    rel="stylesheet"
  >


  <style>


    /* =====================================
       基本設定
    ====================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

    }


    body {

      overflow: hidden;

      color: #333;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        sans-serif;

      transition:
        background-color 0.5s ease;

    }


    /* =====================================
       全体
    ====================================== */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

    }


    /* =====================================
       写真エリア
       
       上半分
    ====================================== */

    .photo-area {

      position: relative;

      width: 100%;

      height: 50%;

      overflow: hidden;

      background:
        rgba(255,255,255,0.15);

      /*
        横スワイプを許可。
        縦方向のページ操作には干渉しにくくする。
      */

      touch-action: pan-y;

    }


    /* =====================================
       写真を流すトラック
    ====================================== */

    .photo-track {

      position: absolute;

      top: 50%;

      left: 0;

      height: 78%;

      display: flex;

      align-items: center;

      gap: 18px;

      width: max-content;

      transform:
        translateY(-50%);

      /*
        JSで位置を動かすので
        CSS animationは使わない。
      */

      will-change: transform;

      cursor: grab;

      user-select: none;

      -webkit-user-select: none;

    }


    .photo-track:active {

      cursor: grabbing;

    }


    /* =====================================
       写真カード
    ====================================== */

    .photo-card {

      flex-shrink: 0;

      height: 100%;

      width: auto;

      padding: 7px;

      background: #fff;

      border-radius: 8px;

      box-shadow:
        0 8px 24px
        rgba(0,0,0,0.14);

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =====================================
       写真本体
       
       縦横比を完全維持
    ====================================== */

    .photo-card img {

      display: block;

      height: 100%;

      width: auto;

      max-width: 58vw;

      object-fit: contain;

      border-radius: 4px;

      pointer-events: none;

      -webkit-user-drag: none;

    }


    /* =====================================
       写真がない場合
    ====================================== */

    .photo-card.hidden {

      display: none;

    }


    /* =====================================
       写真エリア下端
       
       メッセージとの境目を
       少し柔らかくする
    ====================================== */

    .photo-area::after {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      bottom: 0;

      height: 35px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0.40)
        );

      pointer-events: none;

      z-index: 20;

    }


    /* =====================================
       メッセージエリア
       
       下半分
    ====================================== */

    .message-area {

      position: relative;

      width: 100%;

      height: 50%;

      padding:
        24px 28px 18px;

      display: flex;

      flex-direction: column;

      align-items: center;

      background:
        rgba(255,255,255,0.25);

    }


    /* =====================================
       名前
    ====================================== */

    .name {

      flex-shrink: 0;

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 28px;

      font-weight: 600;

      letter-spacing: 0.08em;

      line-height: 1.5;

      text-align: center;

    }


    /* =====================================
       区切り線
    ====================================== */

    .line {

      flex-shrink: 0;

      width: 45px;

      height: 1px;

      margin:
        10px auto 16px;

      background:
        rgba(60,60,60,0.38);

    }


    /* =====================================
       メッセージスクロール部分
    ====================================== */

    .message-wrapper {

      width: 100%;

      max-width: 500px;

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        0 8px;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

    }


    .message-wrapper::-webkit-scrollbar {

      display: none;

    }


    /* =====================================
       メッセージ本文
    ====================================== */

    .message {

      margin: 0;

      padding-bottom: 20px;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 16px;

      font-weight: 400;

      line-height: 2.05;

      letter-spacing: 0.045em;

      text-align: center;

      white-space: pre-line;

    }


    /* =====================================
       フッター
    ====================================== */

    .message-footer {

      flex-shrink: 0;

      margin-top: 8px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 9px;

      letter-spacing: 0.18em;

      color:
        rgba(60,60,60,0.55);

    }


    /* =====================================
       小さいスマホ
    ====================================== */

    @media (max-height: 700px) {


      .photo-area {

        height: 50%;

      }


      .message-area {

        height: 50%;

        padding:
          18px 22px 15px;

      }


      .photo-track {

        height: 76%;

        gap: 14px;

      }


      .photo-card {

        padding: 6px;

      }


      .name {

        font-size: 24px;

      }


      .line {

        margin:
          8px auto 13px;

      }


      .message {

        font-size: 14px;

        line-height: 1.9;

      }


      .message-footer {

        font-size: 8px;

      }

    }


    /* =====================================
       PC
    ====================================== */

    @media (min-width: 700px) {


      body {

        padding-top: 20px;

      }


      .screen {

        height: 850px;

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(0,0,0,0.12);

      }

    }


  </style>

</head>


<body>


  <main class="screen">


    <!-- =================================
         写真エリア
    ================================== -->

    <section
      class="photo-area"
      id="photoArea"
    >


      <div
        class="photo-track"
        id="photoTrack"
      >


        <!-- 写真① -->

        <div
          class="photo-card"
          id="card1"
        >

          <img
            id="photo1"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真② -->

        <div
          class="photo-card"
          id="card2"
        >

          <img
            id="photo2"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真③ -->

        <div
          class="photo-card"
          id="card3"
        >

          <img
            id="photo3"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- =================================
             無限ループ用コピー
        ================================== -->


        <div
          class="photo-card"
          id="card1copy"
        >

          <img
            id="photo1copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card2copy"
        >

          <img
            id="photo2copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card3copy"
        >

          <img
            id="photo3copy"
            src=""
            alt=""
          >

        </div>


      </div>

    </section>


    <!-- =================================
         メッセージエリア
    ================================== -->

    <section class="message-area">


      <h1
        id="name"
        class="name"
      >

        Thank you!

      </h1>


      <div class="line"></div>


      <div
        class="message-wrapper"
        id="messageWrapper"
      >

        <p
          id="message"
          class="message"
        >

          メッセージを読み込んでいます。

        </p>

      </div>


      <div class="message-footer">

        THANK YOU FOR CELEBRATING WITH US

      </div>


    </section>


  </main>


  <!-- =====================================
       ゲストデータ
  ====================================== -->

  <script src="guests.js"></script>


  <script>


    /* =====================================
       URLからID取得
    ===================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* =====================================
       背景色
    ===================================== */

    const backgroundColors = [

      "#F3E9DD",
      "#EEE9E1",
      "#E7EDE8",
      "#E8EDF1",
      "#F2E8D5",
      "#EEE7EE",
      "#E9E4DC",
      "#E5ECE9"

    ];


    function getBackgroundColor(id) {


      if (!id) {

        return backgroundColors[0];

      }


      let number = 0;


      for (
        let i = 0;
        i < id.length;
        i++
      ) {

        number +=
          id.charCodeAt(i);

      }


      return backgroundColors[
        number %
        backgroundColors.length
      ];

    }


    document.body.style.backgroundColor =
      getBackgroundColor(id);


    /* =====================================
       写真セット関数
    ===================================== */

    function setPhoto(
      imageId,
      cardId,
      photoPath
    ) {


      const image =
        document.getElementById(
          imageId
        );


      const card =
        document.getElementById(
          cardId
        );


      if (photoPath) {

        image.src =
          photoPath;

        card.classList.remove(
          "hidden"
        );

      } else {

        card.classList.add(
          "hidden"
        );

      }

    }


    /* =====================================
       ゲスト情報
    ===================================== */

    if (
      id &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* 名前 */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* メッセージ */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* 写真① */

      setPhoto(
        "photo1",
        "card1",
        guest.photos[0]
      );


      /* 写真② */

      setPhoto(
        "photo2",
        "card2",
        guest.photos[1]
      );


      /* 写真③ */

      setPhoto(
        "photo3",
        "card3",
        guest.photos[2]
      );


      /* コピー① */

      setPhoto(
        "photo1copy",
        "card1copy",
        guest.photos[0]
      );


      /* コピー② */

      setPhoto(
        "photo2copy",
        "card2copy",
        guest.photos[1]
      );


      /* コピー③ */

      setPhoto(
        "photo3copy",
        "card3copy",
        guest.photos[2]
      );


    } else {


      /* =================================
         IDなし
      ================================== */

      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.querySelectorAll(
        ".photo-card"
      ).forEach(
        card => {

          card.classList.add(
            "hidden"
          );

        }
      );

    }


    /* =====================================
       写真の自動スクロール
       
       JavaScript方式なので
       手動操作と共存できる
    ===================================== */

    const photoArea =
      document.getElementById(
        "photoArea"
      );


    const photoTrack =
      document.getElementById(
        "photoTrack"
      );


    let position = 0;

    let velocity = 0.45;

    let isDragging = false;

    let startX = 0;

    let startPosition = 0;

    let lastTime = null;


    /* =====================================
       1セット分の幅を取得
    ===================================== */

    function getLoopWidth() {


      const cards =
        photoTrack.querySelectorAll(
          ".photo-card"
        );


      /*
        最初の3枚分を基準にする
      */

      if (cards.length < 6) {

        return 0;

      }


      const first =
        cards[0];

      const fourth =
        cards[3];


      return (
        fourth.offsetLeft -
        first.offsetLeft
      );

    }


    /* =====================================
       写真位置を更新
    ===================================== */

    function updatePhotoPosition() {


      const loopWidth =
        getLoopWidth();


      if (!loopWidth) {

        return;

      }


      /*
        自動スクロール
      */

      if (!isDragging) {

        position -= velocity;

      }


      /*
        無限ループ
      */

      if (
        position <=
        -loopWidth
      ) {

        position +=
          loopWidth;

      }


      if (
        position > 0
      ) {

        position -=
          loopWidth;

      }


      photoTrack.style.transform =
        `translate3d(${position}px, -50%, 0)`;

    }


    /* =====================================
       アニメーションループ
    ===================================== */

    function animate(timestamp) {


      if (lastTime === null) {

        lastTime =
          timestamp;

      }


      lastTime =
        timestamp;


      updatePhotoPosition();


      requestAnimationFrame(
        animate
      );

    }


    requestAnimationFrame(
      animate
    );


    /* =====================================
       タッチ操作
       
       指で左右にスワイプできる
    ===================================== */

    photoArea.addEventListener(
      "touchstart",
      function(event) {


        if (
          event.touches.length !== 1
        ) {

          return;

        }


        isDragging = true;


        startX =
          event.touches[0].clientX;


        startPosition =
          position;

      },
      {
        passive: true
      }
    );


    photoArea.addEventListener(
      "touchmove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const deltaX =
          currentX - startX;


        position =
          startPosition + deltaX;


        /*
          ループ幅
        */

        const loopWidth =
          getLoopWidth();


        if (loopWidth) {


          if (
            position <=
            -loopWidth
          ) {

            position +=
              loopWidth;

            startPosition +=
              loopWidth;

          }


          if (
            position > 0
          ) {

            position -=
              loopWidth;

            startPosition -=
              loopWidth;

          }

        }


      },
      {
        passive: true
      }
    );


    photoArea.addEventListener(
      "touchend",
      function() {

        isDragging = false;

      }
    );


    photoArea.addEventListener(
      "touchcancel",
      function() {

        isDragging = false;

      }
    );


    /* =====================================
       PCでもマウスで操作可能
    ===================================== */

    photoArea.addEventListener(
      "mousedown",
      function(event) {


        isDragging = true;


        startX =
          event.clientX;


        startPosition =
          position;


      }
    );


    window.addEventListener(
      "mousemove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const deltaX =
          event.clientX - startX;


        position =
          startPosition + deltaX;

      }
    );


    window.addEventListener(
      "mouseup",
      function() {

        isDragging = false;

      }
    );


  </script>


</body>
</html>
