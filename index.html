<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Memory</title>


  <!-- ================================
       Google Fonts
  ================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Parisienne&family=Klee+One&family=Libre+Baskerville:wght@400;700&family=Noto+Serif+JP:wght@400;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ==================================================
       基本設定
    ================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        #efefed;

      color:
        #181818;

    }


    body {

      font-family:
        "Noto Serif JP",
        serif;

      -webkit-font-smoothing:
        antialiased;

    }


    /* ==================================================
       ページ本体
    ================================================== */

    .page {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

      background:
        #f8f8f6;

    }


    /* ==================================================
       外側フレーム
    ================================================== */

    .ticket-frame {

      position: absolute;

      inset: 10px;

      border:
        1px solid
        #181818;

      pointer-events:
        none;

      z-index:
        100;

    }


    /* ==================================================
       内側フレーム
    ================================================== */

    .ticket-frame::before {

      content: "";

      position: absolute;

      inset: 7px;

      border:
        1px solid
        rgba(24,24,24,0.18);

    }


    /* ==================================================
       四隅
       ※ 従来の切符感を削って
          シンプルな角の処理に変更
    ================================================== */

    .corner {

      position: absolute;

      width: 15px;
      height: 15px;

      background:
        #f8f8f6;

      z-index:
        101;

    }


    .corner.tl {

      top: -2px;
      left: -2px;

      border-right:
        1px solid #181818;

      border-bottom:
        1px solid #181818;

      border-radius:
        0 0 100% 0;

    }


    .corner.tr {

      top: -2px;
      right: -2px;

      border-left:
        1px solid #181818;

      border-bottom:
        1px solid #181818;

      border-radius:
        0 0 0 100%;

    }


    .corner.bl {

      bottom: -2px;
      left: -2px;

      border-right:
        1px solid #181818;

      border-top:
        1px solid #181818;

      border-radius:
        0 100% 0 0;

    }


    .corner.br {

      bottom: -2px;
      right: -2px;

      border-left:
        1px solid #181818;

      border-top:
        1px solid #181818;

      border-radius:
        100% 0 0 0;

    }


    /* ==================================================
       中央境界
       ※ 見た目だけ残す
    ================================================== */

    .tear-line {

      position: absolute;

      top: 49%;

      left: 28px;
      right: 28px;

      height: 0;

      border-top:
        1px solid
        rgba(24,24,24,0.16);

      z-index:
        105;

      pointer-events:
        none;

    }


    .tear-label {

      position: absolute;

      top: 49%;

      left: 50%;

      transform:
        translate(-50%, -50%);

      z-index:
        106;

      padding:
        0 14px;

      background:
        #f8f8f6;

      font-family:
        "Libre Baskerville",
        serif;

      font-size:
        8px;

      letter-spacing:
        0.24em;

      text-transform:
        uppercase;

      color:
        #777;

      white-space:
        nowrap;

      pointer-events:
        none;

    }


    /* ==================================================
       中央左右の丸
       ※ 旧チケットのノッチはかなり控えめに
    ================================================== */

    .tear-notch {

      position: absolute;

      top: 49%;

      width: 18px;
      height: 18px;

      border-radius:
        50%;

      background:
        #efefed;

      border:
        1px solid
        rgba(24,24,24,0.18);

      transform:
        translateY(-50%);

      z-index:
        110;

      pointer-events:
        none;

    }


    .tear-notch.left {

      left: -10px;

    }


    .tear-notch.right {

      right: -10px;

    }


    /* ==================================================
       縦ミシン目
       ※ かなり薄くして残す
    ================================================== */

    .message-perforation {

      position: absolute;

      top: 15px;
      bottom: 15px;

      width: 1px;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(24,24,24,0.16) 0,
          rgba(24,24,24,0.16) 2px,
          transparent 2px,
          transparent 9px
        );

      z-index:
        99;

      pointer-events:
        none;

    }


    .message-perforation.left {

      left: 17px;

    }


    .message-perforation.right {

      right: 17px;

    }


    /* ==================================================
       メインコンテンツ
    ================================================== */

    .content {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    /* ==================================================
       上部：写真エリア
    ================================================== */

    .film-section {

      position: relative;

      width:
        calc(100% - 32px);

      height:
        calc(49% - 20px);

      margin-left:
        16px;

      top:
        24px;

      overflow:
        hidden;

      background:
        #181818;

      z-index:
        10;

    }


    /* ==================================================
       写真エリア上部タイトル
    ================================================== */

    .film-section::before {

      content:
        "MEMORY";

      position: absolute;

      top: 24px;
      left: 26px;

      z-index:
        25;

      font-family:
        "Libre Baskerville",
        serif;

      font-size:
        8px;

      font-weight:
        700;

      letter-spacing:
        0.28em;

      color:
        rgba(255,255,255,0.82);

    }


    .film-section::after {

      content:
        "RIN & CHIKA / 2026";

      position: absolute;

      top: 24px;
      right: 26px;

      z-index:
        25;

      font-family:
        "Libre Baskerville",
        serif;

      font-size:
        7px;

      letter-spacing:
        0.16em;

      color:
        rgba(255,255,255,0.55);

    }


    /* ==================================================
       フィルム穴
    ================================================== */

    .film-holes {

      position: absolute;

      left: 0;
      right: 0;

      height: 12px;

      z-index:
        20;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-around;

      overflow:
        hidden;

      pointer-events:
        none;

    }


    .film-holes.top {

      top:
        8px;

    }


    .film-holes.bottom {

      bottom:
        8px;

    }


    .film-hole {

      flex:
        0 0 12px;

      width:
        12px;

      height:
        7px;

      min-width:
        12px;

      min-height:
        7px;

      border-radius:
        1px;

      background:
        #f8f8f6;

      opacity:
        0.92;

    }


    /* ==================================================
       写真表示領域
    ================================================== */

    .photo-window {

      position: absolute;

      left: 0;
      right: 0;

      top: 54%;

      height:
        68%;

      transform:
        translateY(-50%);

      overflow:
        hidden;

      z-index:
        10;

      touch-action:
        pan-y;

    }


    .photo-track {

      position: absolute;

      top: 50%;
      left: 0;

      height: 100%;

      display:
        flex;

      align-items:
        center;

      gap:
        14px;

      width:
        max-content;

      transform:
        translate3d(
          0,
          -50%,
          0
        );

      will-change:
        transform;

      user-select:
        none;

      -webkit-user-select:
        none;

      cursor:
        grab;

    }


    .photo-track.dragging {

      cursor:
        grabbing;

    }


    /* ==================================================
       写真
    ================================================== */

    .photo-card {

      position: relative;

      flex:
        0 0 auto;

      height:
        100%;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .photo-card img {

      display:
        block;

      height:
        100%;

      width:
        auto;

      max-width:
        61vw;

      object-fit:
        contain;

      border-radius:
        0;

      box-shadow:
        0 8px 20px
        rgba(0,0,0,0.28);

      pointer-events:
        none;

      -webkit-user-drag:
        none;

    }


    /* ==================================================
       フィルムマーク
    ================================================== */

    .film-mark {

      display:
        none;

    }


    /* ==================================================
       下部メッセージエリア
    ================================================== */

    .message-section {

      position: relative;

      width:
        100%;

      height:
        calc(51% - 5px);

      top:
        20px;

      padding:
        24px 32px 18px;

      background:
        #f8f8f6;

      overflow:
        hidden;

    }


    /* ==================================================
       メッセージカード
       ※ ベージュのカード感をやめて
          紙面のような構成に変更
    ================================================== */

    .message-card {

      position: relative;

      width:
        100%;

      height:
        100%;

      border:
        none;

      padding:
        4px 8px 10px;

      overflow:
        hidden;

      background:
        transparent;

    }


    /* ==================================================
       紙面のごく薄い質感
    ================================================== */

    .message-card::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events:
        none;

      background:
        radial-gradient(
          rgba(20,20,20,0.035) 0.45px,
          transparent 0.7px
        );

      background-size:
        6px 6px;

      opacity:
        0.35;

      z-index:
        1;

    }


    /* ==================================================
       宛名
    ================================================== */

    .guest-name {

      position:
        relative;

      z-index:
        3;

      margin:
        0;

      font-family:
        "Noto Serif JP",
        serif;

      font-size:
        25px;

      font-weight:
        600;

      letter-spacing:
        0.06em;

      line-height:
        1.4;

      color:
        #181818;

      opacity:
        0;

      animation:
        fadeInUp 1.4s ease 0.35s forwards;

    }


    .guest-name.english {

      font-family:
        "Parisienne",
        cursive !important;

      font-size:
        32px;

      letter-spacing:
        0;

      font-weight:
        400;

    }


    /* ==================================================
       宛名下ライン
    ================================================== */

    .name-line {

      position:
        relative;

      z-index:
        3;

      width:
        38px;

      height:
        2px;

      margin:
        9px 0 17px;

      background:
        #181818;

    }


    /* ==================================================
       メッセージスクロール
    ================================================== */

    .message-scroll {

      position:
        relative;

      z-index:
        3;

      height:
        calc(100% - 82px);

      overflow-y:
        auto;

      padding-right:
        8px;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width:
        none;

      opacity:
        0;

      animation:
        fadeInUp 1.6s ease 0.7s forwards;

    }


    .message-scroll::-webkit-scrollbar {

      display:
        none;

    }


    /* ==================================================
       本文
    ================================================== */

    .message {

      margin:
        0;

      padding-bottom:
        20px;

      font-family:
        "Klee One",
        "Noto Serif JP",
        serif;

      font-size:
        14px;

      line-height:
        2.05;

      letter-spacing:
        0.045em;

      white-space:
        pre-line;

      color:
        #303030;

    }


    /* ==================================================
       サイン
    ================================================== */

    .message-signature {

      text-align:
        right;

      padding:
        8px 4px 20px 0;

      font-family:
        "Parisienne",
        cursive;

      font-size:
        27px;

      color:
        #181818;

      opacity:
        0;

      transform:
        translateY(5px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;

    }


    .message-scroll.reached-bottom
    .message-signature {

      opacity:
        1;

      transform:
        translateY(0);

    }


    /* ==================================================
       下部情報
    ================================================== */

    .message-bottom {

      position:
        absolute;

      left:
        8px;

      right:
        8px;

      bottom:
        12px;

      z-index:
        4;

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        space-between;

    }


    .wedding-mark {

      font-family:
        "Libre Baskerville",
        serif;

      font-size:
        7px;

      line-height:
        1.8;

      letter-spacing:
        0.17em;

      color:
        #555;

    }


    .thank-you {

      font-family:
        "Libre Baskerville",
        serif;

      font-size:
        7px;

      line-height:
        1.7;

      letter-spacing:
        0.13em;

      text-align:
        right;

      color:
        #555;

    }


    /* ==================================================
       下部ライン
    ================================================== */

    .bottom-dash {

      position:
        absolute;

      left:
        8px;

      right:
        8px;

      bottom:
        4px;

      height:
        1px;

      background:
        #181818;

      opacity:
        0.35;

      z-index:
        4;

    }


    /* ==================================================
       ハート
       ※ 小さく控えめに
    ================================================== */

    .little-heart {

      position:
        absolute;

      left:
        50%;

      bottom:
        8px;

      transform:
        translateX(-50%);

      z-index:
        6;

      color:
        #181818;

      font-size:
        8px;

    }


    /* ==================================================
       フェードイン
    ================================================== */

    @keyframes fadeInUp {

      from {

        opacity:
          0;

        transform:
          translateY(10px);

      }

      to {

        opacity:
          1;

        transform:
          translateY(0);

      }

    }


    /* ==================================================
       旧要素
       ※ JSやHTML構造を壊さないため残す
    ================================================== */

    .notch,
    .eyebrow,
    .film-line {

      display:
        none;

    }


    /* ==================================================
       スマホ小画面
    ================================================== */

    @media (max-height: 700px) {


      .film-section {

        min-height:
          280px;

      }


      .message-section {

        padding:
          20px 30px 14px;

      }


      .message-card {

        padding:
          2px 7px 8px;

      }


      .guest-name {

        font-size:
          22px;

      }


      .guest-name.english {

        font-size:
          29px;

      }


      .message {

        font-size:
          13px;

        line-height:
          1.95;

      }


      .name-line {

        margin:
          6px 0 12px;

      }

    }


    /* ==================================================
       PC
    ================================================== */

    @media (min-width: 700px) {


      body {

        padding:
          20px 0;

      }


      .page {

        height:
          850px;

        box-shadow:
          0 15px 50px
          rgba(0,0,0,0.12);

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- 外側フレーム -->

    <div class="ticket-frame">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>


    <!-- 中央境界 -->

    <div class="tear-line"></div>

    <div class="tear-label">
      Thank you
    </div>

    <div class="tear-notch left"></div>
    <div class="tear-notch right"></div>

    <div class="message-perforation left"></div>
    <div class="message-perforation right"></div>


    <div class="content">


      <!-- =================================================
           写真エリア
      ================================================== -->

      <section class="film-section">


        <div
          class="film-holes top"
          id="holesTop"
        ></div>


        <div
          class="film-holes bottom"
          id="holesBottom"
        ></div>


        <div class="film-line top"></div>

        <div class="film-line bottom"></div>


        <div
          class="photo-window"
          id="photoWindow"
        >

          <div
            class="photo-track"
            id="photoTrack"
          ></div>

        </div>


      </section>


      <!-- =================================================
           メッセージエリア
      ================================================== -->

      <section class="message-section">


        <div class="message-card">


          <!-- 宛名 -->

          <h1
            id="name"
            class="guest-name"
          >
            Thank you!
          </h1>


          <!-- ライン -->

          <div class="name-line"></div>


          <!-- メッセージ -->

          <div
            class="message-scroll"
            id="messageScroll"
          >

            <p
              id="message"
              class="message"
            >
              メッセージを読み込んでいます。
            </p>


            <div
              class="message-signature"
              id="messageSignature"
            >
              Rin
            </div>

          </div>


          <!-- 下部情報 -->

          <div class="message-bottom">

            <div class="wedding-mark">

              RIN & RIN<br>
              WEDDING

            </div>


            <div class="thank-you">

              THANK YOU FOR<br>
              CELEBRATING WITH US

            </div>

          </div>


          <div class="little-heart">
            ♥
          </div>


          <div class="bottom-dash"></div>


        </div>


      </section>


    </div>


  </main>


  <!-- ==================================================
       ゲストデータ
       ※ ここは変更なし
  ================================================== -->

  <script src="guests.js"></script>


  <script>


    /* ==================================================
       WorkerのURL
       ※ 変更なし
    ================================================== */

    const WORKER_URL =
      "https://wedding-memory-worker.rinkawamura1012.workers.dev";


    /* ==================================================
       URLからID取得
    ================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* ==================================================
       フィルム穴生成
    ================================================== */

    function createFilmHoles() {


      const top =
        document.getElementById(
          "holesTop"
        );


      const bottom =
        document.getElementById(
          "holesBottom"
        );


      const count =
        Math.ceil(
          window.innerWidth / 23
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {


        const hole1 =
          document.createElement(
            "div"
          );

        hole1.className =
          "film-hole";


        const hole2 =
          document.createElement(
            "div"
          );

        hole2.className =
          "film-hole";


        top.appendChild(
          hole1
        );

        bottom.appendChild(
          hole2
        );

      }

    }


    createFilmHoles();


    /* ==================================================
       写真URLを作る
       ※ 変更なし
    ================================================== */

    function createPhotoUrl(
      path
    ) {


      const safePath =
        path
          .split("/")
          .map(
            part =>
              encodeURIComponent(part)
          )
          .join("/");


      return (
        WORKER_URL +
        "/" +
        safePath
      );

    }


    /* ==================================================
       写真カード生成
       ※ 変更なし
    ================================================== */

    function createPhotoCards(
      photos
    ) {


      const track =
        document.getElementById(
          "photoTrack"
        );


      track.innerHTML =
        "";


      if (
        !Array.isArray(photos) ||
        photos.length === 0
      ) {

        return;

      }


      photos.forEach(
        function(photo) {


          const card =
            document.createElement(
              "div"
            );

          card.className =
            "photo-card";


          const image =
            document.createElement(
              "img"
            );


          image.src =
            createPhotoUrl(
              photo
            );

          image.alt =
            "";


          card.appendChild(
            image
          );


          track.appendChild(
            card
          );

        }
      );


      photos.forEach(
        function(photo) {


          const card =
            document.createElement(
              "div"
            );

          card.className =
            "photo-card";


          const image =
            document.createElement(
              "img"
            );


          image.src =
            createPhotoUrl(
              photo
            );

          image.alt =
            "";


          card.appendChild(
            image
          );


          track.appendChild(
            card
          );

        }
      );

    }


    /* ==================================================
       ゲスト情報
       ※ 変更なし
    ================================================== */

    async function loadGuest() {


      if (!id) {


        document.getElementById(
          "name"
        ).textContent =
          "Welcome!";


        document.getElementById(
          "message"
        ).textContent =
          "QRコードからアクセスしてください。";


        return;

      }


      if (
        typeof guests !== "undefined" &&
        guests[id]
      ) {


        const guest =
          guests[id];


        const nameElement =
          document.getElementById("name");


        nameElement.textContent =
          guest.name;


        if (
          !/[\u3040-\u30ff\u3400-\u9fff]/.test(guest.name)
        ) {

          nameElement.classList.add(
            "english"
          );

        }


        document.getElementById(
          "message"
        ).textContent =
          guest.message;

      }


      /* ==================================================
         メッセージを最後までスクロールしたら
         Rinを表示
      ================================================== */

      const messageScroll =
        document.getElementById(
          "messageScroll"
        );


      function checkMessageScroll() {


        const isAtBottom =
          messageScroll.scrollTop +
          messageScroll.clientHeight >=
          messageScroll.scrollHeight - 5;


        if (isAtBottom) {

          messageScroll.classList.add(
            "reached-bottom"
          );

        }

      }


      messageScroll.addEventListener(
        "scroll",
        checkMessageScroll
      );


      checkMessageScroll();


      /* ==================================================
         Workerから写真一覧を取得
         ※ 変更なし
      ================================================== */

      try {


        const response =
          await fetch(
            WORKER_URL +
            "/" +
            encodeURIComponent(id) +
            "/"
          );


        if (!response.ok) {

          throw new Error(
            `Worker error: ${response.status}`
          );

        }


        const data =
          await response.json();


        console.log(
          "Workerから取得した写真:",
          data.photos
        );


        createPhotoCards(
          data.photos
        );


      } catch (error) {


        console.error(
          "写真の取得に失敗しました:",
          error
        );


      }

    }


    loadGuest();


    /* ==================================================
       写真自動スクロール
       ※ 変更なし
    ================================================== */

    const track =
      document.getElementById(
        "photoTrack"
      );


    const windowArea =
      document.getElementById(
        "photoWindow"
      );


    let position = 0;


    let velocity =
      0.38;


    let dragging =
      false;


    let startX =
      0;


    let startPosition =
      0;


    function getLoopWidth() {


      const cards =
        track.querySelectorAll(
          ".photo-card"
        );


      const totalCards =
        cards.length;


      if (
        totalCards < 2
      ) {

        return 0;

      }


      const half =
        totalCards / 2;


      if (
        !Number.isInteger(half)
      ) {

        return 0;

      }


      return (
        cards[half].offsetLeft -
        cards[0].offsetLeft
      );

    }


    function animate() {


      const loopWidth =
        getLoopWidth();


      if (
        !dragging &&
        loopWidth
      ) {


        position -=
          velocity;


        if (
          position <=
          -loopWidth
        ) {

          position +=
            loopWidth;

        }

      }


      track.style.transform =
        `translate3d(
          ${position}px,
          -50%,
          0
        )`;


      requestAnimationFrame(
        animate
      );

    }


    requestAnimationFrame(
      animate
    );


    /* ==================================================
       タッチ操作
       ※ 変更なし
    ================================================== */

    windowArea.addEventListener(
      "touchstart",
      function(event) {


        if (
          event.touches.length !== 1
        ) {

          return;

        }


        dragging =
          true;


        track.classList.add(
          "dragging"
        );


        startX =
          event.touches[0].clientX;


        startPosition =
          position;


      },
      {
        passive: true
      }
    );


    windowArea.addEventListener(
      "touchmove",
      function(event) {


        if (!dragging) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const delta =
          currentX -
          startX;


        position =
          startPosition +
          delta;


        const loopWidth =
          getLoopWidth();


        if (
          loopWidth &&
          position <= -loopWidth
        ) {


          position +=
            loopWidth;


          startPosition +=
            loopWidth;

        }


        if (
          loopWidth &&
          position > 0
        ) {


          position -=
            loopWidth;


          startPosition -=
            loopWidth;

        }

      },
      {
        passive: true
      }
    );


    windowArea.addEventListener(
      "touchend",
      function() {


        dragging =
          false;


        track.classList.remove(
          "dragging"
        );

      }
    );


    /* ==================================================
       PCマウス操作
       ※ 変更なし
    ================================================== */

    windowArea.addEventListener(
      "mousedown",
      function(event) {


        dragging =
          true;


        track.classList.add(
          "dragging"
        );


        startX =
          event.clientX;


        startPosition =
          position;

      }
    );


    window.addEventListener(
      "mousemove",
      function(event) {


        if (!dragging) {

          return;

        }


        position =
          startPosition +
          (
            event.clientX -
            startX
          );


        const loopWidth =
          getLoopWidth();


        if (
          loopWidth &&
          position <= -loopWidth
        ) {


          position +=
            loopWidth;


          startPosition +=
            loopWidth;

        }


        if (
          loopWidth &&
          position > 0
        ) {


          position -=
            loopWidth;


          startPosition -=
            loopWidth;

        }

      }
    );


    window.addEventListener(
      "mouseup",
      function() {


        dragging =
          false;


        track.classList.remove(
          "dragging"
        );

      }
    );


  </script>


</body>
