<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Wedding Message</title>


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 0;
    }

    body {
      background: #f8f7f2;
      color: #333333;

      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "Noto Serif JP",
        serif;

      overflow-x: hidden;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;

      background: #f8f7f2;
    }


    /* ==================================================
       PHOTO / FILM AREA
    ================================================== */

    .photo-section {

      position: relative;

      width: 100%;

      /*
       * ここを47%くらいに固定
       * 高さが大きくなりすぎないようにする
       */
      height: 47vh;

      min-height: 360px;
      max-height: 520px;

      background-color: #252525;

      overflow: hidden;

      touch-action: pan-y;
    }


    /* =========================
       FILM STRIP
    ========================= */

    .film-strip {

      position: absolute;

      left: 0;
      width: 100%;

      height: 42px;

      background: #252525;

      display: flex;
      align-items: center;

      z-index: 10;

      overflow: hidden;
    }


    .film-strip.top {
      top: 0;
    }

    .film-strip.bottom {
      bottom: 0;
    }


    /* =========================
       FILM HOLES
    ========================= */

    .film-holes {

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 8px;

      gap: 8px;
    }


    .film-hole {

      flex: 0 0 24px;

      width: 24px;
      height: 13px;

      background: #f8f7f2;

      border-radius: 3px;
    }


    /* =========================
       FILM LINES
    ========================= */

    .film-line {

      position: absolute;

      left: 0;
      right: 0;

      height: 1px;

      background: rgba(255,255,255,0.18);

      z-index: 11;
    }

    .film-line.top-line {
      top: 42px;
    }

    .film-line.bottom-line {
      bottom: 42px;
    }


    /* ==================================================
       PHOTO TRACK
    ================================================== */

    .photo-track {

      position: absolute;

      /*
       * フィルム穴と写真が重ならないように
       * 上下42pxを確保
       */
      top: 42px;
      bottom: 42px;

      left: 0;

      display: flex;

      align-items: center;

      gap: 26px;

      width: max-content;

      /*
       * ゆっくり横移動
       */
      animation: filmMove 20s linear infinite;

      z-index: 3;

      will-change: transform;
    }


    /* ==================================================
       PHOTO FRAME
    ================================================== */

    .photo-frame {

      /*
       * ここが重要。
       *
       * vhだけでサイズを決めず、
       * 画面幅も考慮してサイズを制限する。
       */

      width: auto;

      height: min(
        calc(47vh - 84px),
        350px
      );

      max-width: 72vw;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      overflow: hidden;
    }


    .photo-frame img {

      display: block;

      /*
       * 高さを基準にしつつ、
       * 横幅が画面を超えないようにする
       */

      height: 100%;

      width: auto;

      max-width: 72vw;

      object-fit: contain;

      border-radius: 2px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.20);

      user-select: none;

      -webkit-user-drag: none;
    }


    /* =========================
       PHOTO ANIMATION
    ========================= */

    @keyframes filmMove {

      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }

    }


    /* ==================================================
       MESSAGE AREA
    ================================================== */

    .message-section {

      position: relative;

      width: 100%;

      min-height: 53vh;

      padding:
        25px
        18px
        20px;

      background: #f8f7f2;

      overflow: hidden;
    }


    /* =========================
       TOP FILM DETAIL
    ========================= */

    .message-top-film {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 12px;

      border-top: 2px solid #d5d2c9;
      border-bottom: 1px solid #e3e0d7;

      background:

        radial-gradient(
          ellipse,
          #c7c4bc 40%,
          transparent 45%
        );

      background-size: 24px 8px;
      background-repeat: repeat-x;
      background-position: center;

      opacity: 0.8;
    }


    /* ==================================================
       TICKET
    ================================================== */

    .ticket {

      position: relative;

      width: 100%;

      max-width: 700px;

      margin: 0 auto;

      padding:
        25px
        24px
        18px;

      border:
        1px solid #bcb6a9;

      background:
        rgba(255,255,255,0.32);

      overflow: hidden;
    }


    /* =========================
       INNER BORDER
    ========================= */

    .ticket::before {

      content: "";

      position: absolute;

      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;

      border:
        1px solid #d4cec1;

      pointer-events: none;
    }


    /* ==================================================
       TOP DECORATION
    ================================================== */

    .ticket-header {

      position: relative;

      width: 100%;
      height: 20px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .ticket-header::before,
    .ticket-header::after {

      content: "";

      position: absolute;

      top: 50%;

      width: 30%;

      height: 1px;

      background: #c2bbad;
    }


    .ticket-header::before {
      left: 4%;
    }

    .ticket-header::after {
      right: 4%;
    }


    .diamond {

      position: relative;

      width: 9px;
      height: 9px;

      background: #b5aa97;

      transform: rotate(45deg);

      z-index: 2;
    }


    /* ==================================================
       NAME
    ================================================== */

    .guest-name {

      position: relative;

      margin:
        10px
        0
        7px;

      padding-left: 2px;

      font-size: 28px;

      font-weight: 400;

      letter-spacing: 0.08em;

      line-height: 1.4;

      color: #333333;
    }


    .name-line {

      width: 92px;
      height: 2px;

      margin-left: 2px;

      margin-bottom: 18px;

      background: #aaa397;
    }


    /* ==================================================
       MESSAGE
    ================================================== */

    .message-box {

      position: relative;

      width: 100%;

      /*
       * 横幅を最大限使う
       *
       * 長文だけここがスクロール
       */
      max-height: 330px;

      overflow-y: auto;

      padding:
        0
        2px;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;

      scrollbar-color:
        #c5bfb4
        transparent;
    }


    .message-box::-webkit-scrollbar {
      width: 3px;
    }


    .message-box::-webkit-scrollbar-track {
      background: transparent;
    }


    .message-box::-webkit-scrollbar-thumb {

      background: #c5bfb4;

      border-radius: 10px;
    }


    .message {

      font-size: 17px;

      line-height: 2.05;

      letter-spacing: 0.045em;

      color: #414141;

      white-space: pre-wrap;

      padding-right: 4px;
    }


    /* ==================================================
       FOOTER
    ================================================== */

    .ticket-footer {

      position: relative;

      display: flex;

      justify-content: space-between;

      align-items: flex-end;

      margin-top: 15px;

      padding:
        0
        3px;

      color: #817a6e;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      letter-spacing: 0.15em;

      font-size: 9px;

      line-height: 1.5;
    }


    .footer-left {
      text-align: left;
    }


    .footer-right {
      text-align: right;
    }


    /* =========================
       HEART
    ========================= */

    .heart {

      position: absolute;

      left: 50%;
      bottom: 0;

      transform:
        translateX(-50%);

      color: #9e927e;

      font-size: 14px;
    }


    /* ==================================================
       SIDE NOTCHES
    ================================================== */

    .ticket-notch {

      position: absolute;

      width: 28px;
      height: 28px;

      border:
        1px solid #bcb6a9;

      border-radius: 50%;

      background: #f8f7f2;

      z-index: 5;
    }


    .ticket-notch.left {

      left: -15px;

      top: 50%;

      transform:
        translateY(-50%);
    }


    .ticket-notch.right {

      right: -15px;

      top: 50%;

      transform:
        translateY(-50%);
    }


    /* ==================================================
       BOTTOM DECORATION
    ================================================== */

    .bottom-decoration {

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-top: 10px;

      opacity: 0.65;
    }


    .bottom-decoration::before,
    .bottom-decoration::after {

      content: "";

      width: 50px;
      height: 1px;

      background: #bdb7aa;
    }


    /* ==================================================
       SMALL SCREEN
    ================================================== */

    @media (max-width: 600px) {

      .photo-section {

        height: 47vh;

        min-height: 350px;
        max-height: 500px;
      }


      .film-strip {

        height: 40px;
      }


      .film-strip.top {
        top: 0;
      }


      .film-strip.bottom {
        bottom: 0;
      }


      .film-hole {

        flex-basis: 21px;

        width: 21px;
        height: 12px;
      }


      .film-line.top-line {
        top: 40px;
      }


      .film-line.bottom-line {
        bottom: 40px;
      }


      .photo-track {

        top: 40px;
        bottom: 40px;

        gap: 22px;
      }


      .photo-frame {

        height:
          min(
            calc(47vh - 80px),
            330px
          );

        max-width: 68vw;
      }


      .photo-frame img {

        max-width: 68vw;

        max-height: 100%;
      }


      .message-section {

        padding:
          24px
          15px
          18px;
      }


      .ticket {

        padding:
          23px
          19px
          17px;
      }


      .guest-name {

        font-size: 27px;
      }


      .message-box {

        max-height: 320px;
      }


      .message {

        font-size: 16.5px;

        line-height: 2.05;

        letter-spacing: 0.04em;
      }


      .ticket-footer {

        font-size: 8px;
      }

    }


    /* ==================================================
       TALL IPHONE
    ================================================== */

    @media
      screen and (min-height: 800px)
      and (max-width: 600px) {

      .photo-section {

        height: 46vh;
      }


      .photo-frame {

        height:
          min(
            calc(46vh - 80px),
            340px
          );
      }


      .message-box {

        max-height: 350px;
      }

    }


    /* ==================================================
       REDUCE MOTION
    ================================================== */

    @media (prefers-reduced-motion: reduce) {

      .photo-track {

        animation: none;
      }

    }

  </style>

</head>


<body>


<div class="page">


  <!-- ==================================================
       PHOTO SECTION
  ================================================== -->

  <section
    class="photo-section"
    id="photoSection">


    <!-- 上のフィルム -->

    <div class="film-strip top">

      <div class="film-holes">

        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>

      </div>

    </div>


    <!-- 下のフィルム -->

    <div class="film-strip bottom">

      <div class="film-holes">

        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>

      </div>

    </div>


    <div class="film-line top-line"></div>

    <div class="film-line bottom-line"></div>


    <!-- 写真 -->

    <div
      class="photo-track"
      id="photoTrack">
    </div>


  </section>



  <!-- ==================================================
       MESSAGE SECTION
  ================================================== -->

  <section class="message-section">


    <div class="message-top-film"></div>


    <div class="ticket">


      <!-- 上部装飾 -->

      <div class="ticket-header">

        <span class="diamond"></span>

      </div>


      <!-- 宛名 -->

      <h1
        class="guest-name"
        id="name">

        Welcome!

      </h1>


      <div class="name-line"></div>


      <!-- メッセージ -->

      <div
        class="message-box"
        id="messageBox">

        <div
          class="message"
          id="message">

          メッセージを読み込んでいます。

        </div>

      </div>


      <!-- フッター -->

      <div class="ticket-footer">

        <div class="footer-left">

          RIN &amp; RIN<br>
          WEDDING

        </div>


        <div class="footer-right">

          THANK YOU FOR<br>
          CELEBRATING WITH US

        </div>


        <div class="heart">

          ♥
          
        </div>

      </div>


      <!-- 左右の切れ込み -->

      <div class="ticket-notch left"></div>

      <div class="ticket-notch right"></div>


    </div>


    <div class="bottom-decoration"></div>


  </section>


</div>



<!-- ==================================================
     GUEST DATA
================================================== -->

<script src="guests.js"></script>


<script>


  /* ==================================================
     URLからID取得
  ================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");



  /* ==================================================
     ゲスト情報
  ================================================== */

  if (
    id &&
    typeof guests !== "undefined" &&
    guests[id]
  ) {


    const guest =
      guests[id];


    /* =========================
       名前
    ========================= */

    document.getElementById("name")
      .textContent =
        `${guest.name}さんへ`;



    /* =========================
       メッセージ
    ========================= */

    document.getElementById("message")
      .textContent =
        guest.message;



    /* =========================
       写真
    ========================= */

    const track =
      document.getElementById(
        "photoTrack"
      );


    const photos =
      guest.photos || [];


    if (photos.length > 0) {


      /*
       * 2セット並べることで
       * 無限スクロールっぽくする
       */

      const photoList =
        [
          ...photos,
          ...photos
        ];


      photoList.forEach(
        (photo) => {


          const frame =
            document.createElement(
              "div"
            );


          frame.className =
            "photo-frame";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            photo;


          img.alt =
            `${guest.name}さんとの思い出`;


          img.draggable =
            false;


          frame.appendChild(
            img
          );


          track.appendChild(
            frame
          );

        }
      );

    }


  } else {


    /* =========================
       IDがない場合
    ========================= */

    document.getElementById("name")
      .textContent =
        "Welcome!";


    document.getElementById("message")
      .textContent =
        "QRコードからアクセスしてください。";

  }



  /* ==================================================
     写真の手動スワイプ
  ================================================== */

  const photoSection =
    document.getElementById(
      "photoSection"
    );


  const photoTrack =
    document.getElementById(
      "photoTrack"
    );


  let startX = 0;

  let currentX = 0;

  let dragging = false;


  photoSection.addEventListener(
    "touchstart",
    (event) => {

      startX =
        event.touches[0].clientX;

      dragging = true;

      photoTrack.style.animationPlayState =
        "paused";

    },
    {
      passive: true
    }
  );


  photoSection.addEventListener(
    "touchmove",
    (event) => {

      if (!dragging) return;


      currentX =
        event.touches[0].clientX;


      const diff =
        currentX - startX;


      photoTrack.style.transform =
        `translateX(${diff}px)`;

    },
    {
      passive: true
    }
  );


  photoSection.addEventListener(
    "touchend",
    () => {

      dragging = false;

      photoTrack.style.transform = "";

      photoTrack.style.animationPlayState =
        "running";

    }
  );


</script>


</body>
</html>
