<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Message</title>


  <!-- 手書き風フォント -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

    }


    body {

      overflow: hidden;

      color: #333;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        sans-serif;

      transition:
        background-color 0.5s ease;

    }


    /* =========================================
       メイン画面
    ========================================= */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

    }


    /* =========================================
       写真エリア
    ========================================= */

    .photo-area {

      position: relative;

      width: 100%;

      height: 45%;

      overflow: hidden;

      background:
        rgba(255,255,255,0.18);

    }


    /*
      写真エリアの上に
      ほんのり白いグラデーション
    */

    .photo-area::after {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      bottom: 0;

      height: 50px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0.45)
        );

      pointer-events: none;

      z-index: 10;

    }


    /* =========================================
       写真を流すレーン
    ========================================= */

    .photo-track {

      position: absolute;

      top: 50%;

      left: 0;

      height: 72%;

      display: flex;

      align-items: center;

      gap: 18px;

      /*
        写真3枚分＋複製3枚分。

        右→左へ流す。
      */

      width: max-content;

      transform:
        translateY(-50%);

      animation:
        photoScroll 28s linear infinite;

    }


    /* =========================================
       写真カード
    ========================================= */

    .photo-card {

      flex-shrink: 0;

      height: 100%;

      width: auto;

      padding: 7px;

      background: #fff;

      border-radius: 7px;

      box-shadow:
        0 8px 24px
        rgba(0,0,0,0.14);

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =========================================
       写真本体

       object-fit: containなので
       縦横比を完全維持
    ========================================= */

    .photo-card img {

      display: block;

      height: 100%;

      width: auto;

      max-width: 55vw;

      object-fit: contain;

      border-radius: 3px;

    }


    /* =========================================
       写真がない場合
    ========================================= */

    .photo-card.hidden {

      display: none;

    }


    /* =========================================
       写真スクロールアニメーション
    ========================================= */

    @keyframes photoScroll {

      from {

        transform:
          translate(
            0,
            -50%
          );

      }

      to {

        /*
          3枚分＋gap分を
          左へ移動
        */

        transform:
          translate(
            -50%,
            -50%
          );

      }

    }


    /* =========================================
       写真エリアタイトル
    ========================================= */

    .photo-title {

      position: absolute;

      top: 14px;

      left: 0;

      width: 100%;

      text-align: center;

      z-index: 20;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 10px;

      letter-spacing: 0.22em;

      color:
        rgba(60,60,60,0.58);

    }


    /* =========================================
       メッセージエリア
    ========================================= */

    .message-area {

      position: relative;

      width: 100%;

      height: 55%;

      padding:
        28px 28px 25px;

      display: flex;

      flex-direction: column;

      align-items: center;

      background:
        rgba(255,255,255,0.28);

    }


    /* =========================================
       名前
    ========================================= */

    .name {

      flex-shrink: 0;

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 28px;

      font-weight: 600;

      letter-spacing: 0.08em;

      line-height: 1.5;

      text-align: center;

    }


    /* =========================================
       区切り線
    ========================================= */

    .line {

      flex-shrink: 0;

      width: 45px;

      height: 1px;

      margin:
        12px auto 20px;

      background:
        rgba(60,60,60,0.38);

    }


    /* =========================================
       メッセージスクロール部分
    ========================================= */

    .message-wrapper {

      width: 100%;

      max-width: 500px;

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        0 8px;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

    }


    .message-wrapper::-webkit-scrollbar {

      display: none;

    }


    /* =========================================
       メッセージ本文
    ========================================= */

    .message {

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 16px;

      font-weight: 400;

      line-height: 2.1;

      letter-spacing: 0.045em;

      text-align: center;

      white-space: pre-line;

      padding-bottom: 25px;

    }


    /* =========================================
       メッセージ下部
    ========================================= */

    .message-footer {

      flex-shrink: 0;

      margin-top: 12px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 9px;

      letter-spacing: 0.18em;

      color:
        rgba(60,60,60,0.55);

    }


    /* =========================================
       小さいスマホ対応
    ========================================= */

    @media (max-height: 700px) {


      .photo-area {

        height: 43%;

      }


      .message-area {

        height: 57%;

        padding:
          20px 22px 18px;

      }


      .photo-track {

        height: 68%;

        gap: 14px;

      }


      .photo-card {

        padding: 6px;

      }


      .name {

        font-size: 24px;

      }


      .line {

        margin:
          9px auto 15px;

      }


      .message {

        font-size: 14px;

        line-height: 1.95;

      }

    }


    /* =========================================
       PC表示
    ========================================= */

    @media (min-width: 700px) {


      body {

        padding-top: 20px;

      }


      .screen {

        height: 850px;

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(0,0,0,0.12);

      }

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- =====================================
         写真エリア
    ====================================== -->

    <section class="photo-area">


      <div class="photo-title">

        MEMORIES

      </div>


      <div
        class="photo-track"
        id="photoTrack"
      >


        <!-- 写真① -->

        <div
          class="photo-card"
          id="card1"
        >

          <img
            id="photo1"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真② -->

        <div
          class="photo-card"
          id="card2"
        >

          <img
            id="photo2"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真③ -->

        <div
          class="photo-card"
          id="card3"
        >

          <img
            id="photo3"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- =================================
             ループ用コピー
        ================================== -->


        <div
          class="photo-card"
          id="card1copy"
        >

          <img
            id="photo1copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card2copy"
        >

          <img
            id="photo2copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card3copy"
        >

          <img
            id="photo3copy"
            src=""
            alt=""
          >

        </div>


      </div>


    </section>


    <!-- =====================================
         メッセージエリア
    ====================================== -->

    <section class="message-area">


      <h1
        id="name"
        class="name"
      >

        Thank you!

      </h1>


      <div class="line"></div>


      <div class="message-wrapper">


        <p
          id="message"
          class="message"
        >

          メッセージを読み込んでいます。

        </p>


      </div>


      <div class="message-footer">

        THANK YOU FOR CELEBRATING WITH US

      </div>


    </section>


  </main>


  <!-- =======================================
       ゲストデータ
  ======================================== -->

  <script src="guests.js"></script>


  <script>


    /* =======================================
       URLからID取得
    ======================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* =======================================
       背景色
    ======================================= */

    const backgroundColors = [

      "#F3E9DD",
      "#EEE9E1",
      "#E7EDE8",
      "#E8EDF1",
      "#F2E8D5",
      "#EEE7EE",
      "#E9E4DC",
      "#E5ECE9"

    ];


    function getBackgroundColor(id) {


      if (!id) {

        return backgroundColors[0];

      }


      let number = 0;


      for (
        let i = 0;
        i < id.length;
        i++
      ) {

        number +=
          id.charCodeAt(i);

      }


      return backgroundColors[
        number %
        backgroundColors.length
      ];

    }


    document.body.style.backgroundColor =
      getBackgroundColor(id);


    /* =======================================
       写真をセット
    ======================================= */

    function setPhoto(
      imageId,
      cardId,
      photoPath
    ) {


      const image =
        document.getElementById(
          imageId
        );


      const card =
        document.getElementById(
          cardId
        );


      if (photoPath) {

        image.src =
          photoPath;

        card.classList.remove(
          "hidden"
        );

      } else {

        card.classList.add(
          "hidden"
        );

      }

    }


    /* =======================================
       ゲスト情報
    ======================================= */

    if (
      id &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* -----------------------------------
         名前
      ----------------------------------- */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* -----------------------------------
         メッセージ
      ----------------------------------- */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* -----------------------------------
         写真①
      ----------------------------------- */

      setPhoto(
        "photo1",
        "card1",
        guest.photos[0]
      );


      /* -----------------------------------
         写真②
      ----------------------------------- */

      setPhoto(
        "photo2",
        "card2",
        guest.photos[1]
      );


      /* -----------------------------------
         写真③
      ----------------------------------- */

      setPhoto(
        "photo3",
        "card3",
        guest.photos[2]
      );


      /* -----------------------------------
         ループ用コピー
      ----------------------------------- */

      setPhoto(
        "photo1copy",
        "card1copy",
        guest.photos[0]
      );


      setPhoto(
        "photo2copy",
        "card2copy",
        guest.photos[1]
      );


      setPhoto(
        "photo3copy",
        "card3copy",
        guest.photos[2]
      );


    }


    /* =======================================
       IDが存在しない場合
    ======================================= */

    else {


      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.querySelectorAll(
        ".photo-card"
      ).forEach(
        card => {
          card.classList.add(
            "hidden"
          );
        }
      );

    }


  </script>


</body>
</html>
