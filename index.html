<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Message</title>


  <!-- 手書き風フォント -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =================================
       基本設定
    ================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

    }


    body {

      overflow: hidden;

      color: #333;

      font-family:
        "Klee One",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      transition:
        background-color 0.5s ease;

    }


    /* =================================
       メイン画面
    ================================= */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

    }


    /* =================================
       写真共通
    ================================= */

    .photo {

      position: absolute;

      display: block;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 7px;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.16);

    }


    /* =================================
       写真①
       左上
    ================================= */

    .photo-1 {

      width: 58%;

      max-height: 36%;

      top: 5%;

      left: 2%;

      z-index: 1;

    }


    /* =================================
       写真②
       中央寄り・一番大きい
       メッセージの後ろに配置
    ================================= */

    .photo-2 {

      width: 62%;

      max-height: 43%;

      top: 15%;

      right: 3%;

      z-index: 4;

    }


    /* =================================
       写真③
       左下
    ================================= */

    .photo-3 {

      width: 57%;

      max-height: 35%;

      bottom: 5%;

      left: 8%;

      z-index: 1;

    }


    /* =================================
       中央メッセージカード
    ================================= */

    .message-card {

      position: absolute;

      width: 78%;

      max-width: 470px;

      max-height: 48%;

      top: 53%;

      left: 50%;

      transform:
        translate(-50%, -50%);

      padding:
        30px 27px 28px;

      /*
        かなり透ける白。
        後ろの写真が見える。
      */

      background:
        rgba(255, 255, 255, 0.58);

      border:
        1px solid rgba(255, 255, 255, 0.75);

      border-radius: 20px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.10);

      backdrop-filter:
        blur(3px);

      -webkit-backdrop-filter:
        blur(3px);

      text-align: center;

      z-index: 10;

    }


    /* =================================
       名前
    ================================= */

    .name {

      margin: 0 0 15px;

      font-family:
        "Klee One",
        cursive;

      font-size: 30px;

      font-weight: 600;

      letter-spacing: 0.08em;

      line-height: 1.4;

    }


    /* =================================
       区切り線
    ================================= */

    .line {

      width: 45px;

      height: 1px;

      margin:
        0 auto 18px;

      background:
        rgba(60, 60, 60, 0.45);

    }


    /* =================================
       メッセージ
    ================================= */

    .message-wrapper {

      max-height: 25vh;

      overflow-y: auto;

      padding:
        0 5px;

      -webkit-overflow-scrolling:
        touch;

      /*
        スクロールバーを目立たせない
      */

      scrollbar-width: none;

    }


    .message-wrapper::-webkit-scrollbar {

      display: none;

    }


    .message {

      margin: 0;

      font-family:
        "Klee One",
        cursive;

      font-size: 16px;

      font-weight: 400;

      line-height: 2;

      letter-spacing: 0.04em;

      white-space: pre-line;

    }


    /* =================================
       下部テキスト
    ================================= */

    .footer {

      position: absolute;

      bottom: 1.8%;

      left: 0;

      width: 100%;

      text-align: center;

      font-family:
        Georgia,
        serif;

      font-size: 10px;

      letter-spacing: 0.16em;

      color:
        rgba(60, 60, 60, 0.62);

      z-index: 20;

    }


    /* =================================
       写真なし
    ================================= */

    .hidden {

      display: none;

    }


    /* =================================
       小さいスマホ
    ================================= */

    @media (max-height: 700px) {


      .photo-1 {

        width: 55%;

        max-height: 32%;

      }


      .photo-2 {

        width: 60%;

        max-height: 38%;

      }


      .photo-3 {

        width: 54%;

        max-height: 31%;

      }


      .message-card {

        width: 80%;

        max-height: 47%;

        padding:
          23px 21px 22px;

      }


      .name {

        font-size: 25px;

        margin-bottom: 11px;

      }


      .line {

        margin-bottom: 13px;

      }


      .message-wrapper {

        max-height: 22vh;

      }


      .message {

        font-size: 14px;

        line-height: 1.85;

      }

    }


    /* =================================
       PC
    ================================= */

    @media (min-width: 700px) {


      .screen {

        height: 850px;

        margin-top: 20px;

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(0, 0, 0, 0.12);

      }

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- =============================
         写真①
    ============================== -->

    <img
      id="photo1"
      class="photo photo-1"
      src=""
      alt="思い出の写真"
    >


    <!-- =============================
         写真②
    ============================== -->

    <img
      id="photo2"
      class="photo photo-2"
      src=""
      alt="思い出の写真"
    >


    <!-- =============================
         写真③
    ============================== -->

    <img
      id="photo3"
      class="photo photo-3"
      src=""
      alt="思い出の写真"
    >


    <!-- =============================
         メッセージ
    ============================== -->

    <section class="message-card">


      <h1
        id="name"
        class="name"
      >
        Thank you!
      </h1>


      <div class="line"></div>


      <div class="message-wrapper">

        <p
          id="message"
          class="message"
        >
          メッセージを読み込んでいます。
        </p>

      </div>


    </section>


    <!-- =============================
         フッター
    ============================== -->

    <div class="footer">

      THANK YOU FOR CELEBRATING WITH US

    </div>


  </main>


  <!-- =============================
       ゲストデータ
  ============================== -->

  <script src="guests.js"></script>


  <!-- =============================
       表示処理
  ============================== -->

  <script>


    /* --------------------------------
       URLからID取得
    -------------------------------- */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get("id");


    /* --------------------------------
       背景色
       ゲストごとに固定
    -------------------------------- */

    const backgroundColors = [

      "#F3E9DD",
      "#EEE9E1",
      "#E7EDE8",
      "#E8EDF1",
      "#F2E8D5",
      "#EEE7EE",
      "#E9E4DC",
      "#E5ECE9"

    ];


    function getBackgroundColor(id) {


      if (!id) {

        return backgroundColors[0];

      }


      let number = 0;


      for (
        let i = 0;
        i < id.length;
        i++
      ) {

        number +=
          id.charCodeAt(i);

      }


      return backgroundColors[
        number %
        backgroundColors.length
      ];

    }


    document.body.style.backgroundColor =
      getBackgroundColor(id);


    /* --------------------------------
       写真をセット
    -------------------------------- */

    function setPhoto(
      elementId,
      photoPath
    ) {


      const photo =
        document.getElementById(
          elementId
        );


      if (photoPath) {

        photo.src =
          photoPath;

        photo.classList.remove(
          "hidden"
        );

      } else {

        photo.classList.add(
          "hidden"
        );

      }

    }


    /* --------------------------------
       ゲストが存在
    -------------------------------- */

    if (
      id &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* 名前 */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* メッセージ */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* 写真 */

      setPhoto(
        "photo1",
        guest.photos[0]
      );


      setPhoto(
        "photo2",
        guest.photos[1]
      );


      setPhoto(
        "photo3",
        guest.photos[2]
      );


    }


    /* --------------------------------
       ゲストが存在しない場合
    -------------------------------- */

    else {


      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.getElementById(
        "photo1"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo2"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo3"
      ).classList.add(
        "hidden"
      );

    }


  </script>


</body>
</html>
