<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Message</title>


  <!-- ================================
       手書き風フォント
  ================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
    rel="stylesheet"
  >


  <style>


    /* =================================
       基本設定
    ================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

    }


    body {

      overflow: hidden;

      color: #333;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        sans-serif;

      transition:
        background-color 0.6s ease;

    }


    /* =================================
       全体
    ================================= */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

    }


    /* =================================
       写真エリア
    ================================= */

    .photo-area {

      position: relative;

      width: 100%;

      height: 50%;

      overflow: hidden;

      background: #1f1f1f;

      touch-action: pan-y;

    }


    /* =================================
       写真トラック
    ================================= */

    .photo-track {

      position: absolute;

      top: 50%;
      left: 0;

      height: 76%;

      display: flex;

      align-items: center;

      gap: 28px;

      width: max-content;

      transform:
        translateY(-50%);

      will-change: transform;

      cursor: grab;

      user-select: none;

      -webkit-user-select: none;

      z-index: 5;

    }


    .photo-track:active {

      cursor: grabbing;

    }


    /* =================================
       写真1枚分
    ================================= */

    .photo-card {

      position: relative;

      flex-shrink: 0;

      height: 100%;

      width: auto;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =================================
       写真
    ================================= */

    .photo-card img {

      display: block;

      height: 100%;

      width: auto;

      max-width: 68vw;

      object-fit: contain;

      border-radius: 2px;

      pointer-events: none;

      -webkit-user-drag: none;

    }


    .photo-card.hidden {

      display: none;

    }


    /* =================================
       フィルム穴
       
       写真の上下に小さな穴
    ================================= */

    .photo-card::before,
    .photo-card::after {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      height: 9px;

      z-index: 10;

      pointer-events: none;

      /*
        穴を横に並べる
      */

      background-image:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,0.72) 0,
          rgba(255,255,255,0.72) 3px,
          transparent 3.5px
        );

      background-size:
        15px 9px;

      background-repeat:
        repeat-x;

      opacity: 0.75;

    }


    .photo-card::before {

      top: -15px;

    }


    .photo-card::after {

      bottom: -15px;

    }


    /* =================================
       写真と写真の間
       
       フィルムの区切り感
    ================================= */

    .photo-card + .photo-card {

      margin-left: 0;

    }


    /* =================================
       上下のフィルムライン
    ================================= */

    .photo-area::before {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      top: 12%;

      height: 1px;

      background:
        rgba(255,255,255,0.14);

      z-index: 3;

      pointer-events: none;

    }


    .photo-area::after {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      bottom: 12%;

      height: 1px;

      background:
        rgba(255,255,255,0.14);

      z-index: 3;

      pointer-events: none;

    }


    /* =================================
       フィルムの光漏れ
       
       ごく薄く画面を横切る
    ================================= */

    .light-leak {

      position: absolute;

      top: 0;
      bottom: 0;

      left: -35%;

      width: 35%;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,150,90,0.04) 35%,
          rgba(255,210,140,0.12) 60%,
          rgba(255,130,80,0.04) 80%,
          transparent 100%
        );

      filter:
        blur(10px);

      pointer-events: none;

      z-index: 20;

      animation:
        lightLeakMove 11s
        ease-in-out
        infinite;

    }


    @keyframes lightLeakMove {

      0% {

        transform:
          translateX(-20%);

        opacity: 0;

      }

      20% {

        opacity: 0.8;

      }

      50% {

        opacity: 1;

      }

      80% {

        opacity: 0.5;

      }

      100% {

        transform:
          translateX(420%);

        opacity: 0;

      }

    }


    /* =================================
       フィルム粒子
    ================================= */

    .film-grain {

      position: absolute;

      inset: 0;

      z-index: 30;

      pointer-events: none;

      opacity: 0.13;

      background-image:

        radial-gradient(
          rgba(255,255,255,0.7) 0.5px,
          transparent 0.8px
        ),

        radial-gradient(
          rgba(0,0,0,0.5) 0.5px,
          transparent 0.8px
        );

      background-size:
        5px 5px,
        7px 7px;

      background-position:
        0 0,
        3px 4px;

      animation:
        grainMove 0.25s
        steps(2)
        infinite;

    }


    @keyframes grainMove {

      0% {
        transform:
          translate(0,0);
      }

      25% {
        transform:
          translate(1px,-1px);
      }

      50% {
        transform:
          translate(-1px,1px);
      }

      75% {
        transform:
          translate(1px,1px);
      }

      100% {
        transform:
          translate(0,0);
      }

    }


    /* =================================
       メッセージエリア
    ================================= */

    .message-area {

      position: relative;

      width: 100%;

      height: 50%;

      padding:
        25px 28px 16px;

      display: flex;

      flex-direction: column;

      align-items: stretch;

      background:
        rgba(255,255,255,0.65);

      background-image:

        radial-gradient(
          rgba(70,70,70,0.035) 0.6px,
          transparent 0.7px
        );

      background-size:
        7px 7px;

    }


    /* =================================
       さりげない円形装飾
    ================================= */

    .message-area::before {

      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      top: -100px;
      right: -75px;

      border:
        1px solid
        rgba(80,90,80,0.08);

      border-radius:
        50% 40% 55% 45%;

      transform:
        rotate(25deg);

      pointer-events: none;

    }


    .message-area::after {

      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      bottom: -60px;
      left: -50px;

      border:
        1px solid
        rgba(80,90,80,0.07);

      border-radius:
        45% 55% 40% 60%;

      transform:
        rotate(-20deg);

      pointer-events: none;

    }


    /* =================================
       宛名
    ================================= */

    .name {

      position: relative;

      z-index: 2;

      flex-shrink: 0;

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 27px;

      font-weight: 600;

      letter-spacing: 0.08em;

      line-height: 1.5;

      text-align: left;

    }


    /* =================================
       区切り線
    ================================= */

    .line {

      position: relative;

      z-index: 2;

      width: 55px;

      height: 1px;

      margin:
        9px 0 15px;

      background:
        rgba(60,60,60,0.32);

    }


    /* =================================
       メッセージ
    ================================= */

    .message-wrapper {

      position: relative;

      z-index: 2;

      width: 100%;

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding-right: 4px;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

    }


    .message-wrapper::-webkit-scrollbar {

      display: none;

    }


    .message {

      margin: 0;

      padding-bottom: 20px;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 16px;

      font-weight: 400;

      line-height: 2.05;

      letter-spacing: 0.045em;

      text-align: left;

      white-space: pre-line;

    }


    /* =================================
       一番下
    ================================= */

    .message-footer {

      position: relative;

      z-index: 2;

      flex-shrink: 0;

      margin-top: 7px;

      text-align: right;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 8px;

      letter-spacing: 0.16em;

      color:
        rgba(60,60,60,0.50);

    }


    /* =================================
       スマホ小画面
    ================================= */

    @media (max-height: 700px) {


      .message-area {

        padding:
          19px 23px 13px;

      }


      .photo-track {

        height: 75%;

        gap: 22px;

      }


      .photo-card img {

        max-width: 72vw;

      }


      .name {

        font-size: 24px;

      }


      .line {

        margin:
          7px 0 12px;

      }


      .message {

        font-size: 14px;

        line-height: 1.9;

      }


      .message-footer {

        font-size: 7px;

      }

    }


    /* =================================
       PC
    ================================= */

    @media (min-width: 700px) {


      body {

        padding-top: 20px;

      }


      .screen {

        height: 850px;

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(0,0,0,0.12);

      }

    }


  </style>

</head>


<body>


  <main class="screen">


    <!-- =================================
         写真エリア
    ================================== -->

    <section
      class="photo-area"
      id="photoArea"
    >


      <!-- 光漏れ -->

      <div class="light-leak"></div>


      <!-- フィルム粒子 -->

      <div class="film-grain"></div>


      <!-- 写真 -->

      <div
        class="photo-track"
        id="photoTrack"
      >


        <!-- 写真① -->

        <div
          class="photo-card"
          id="card1"
        >

          <img
            id="photo1"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真② -->

        <div
          class="photo-card"
          id="card2"
        >

          <img
            id="photo2"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真③ -->

        <div
          class="photo-card"
          id="card3"
        >

          <img
            id="photo3"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- =================================
             無限ループ用
        ================================== -->

        <div
          class="photo-card"
          id="card1copy"
        >

          <img
            id="photo1copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card2copy"
        >

          <img
            id="photo2copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card3copy"
        >

          <img
            id="photo3copy"
            src=""
            alt=""
          >

        </div>


      </div>


    </section>


    <!-- =================================
         メッセージ
    ================================== -->

    <section
      class="message-area"
      id="messageArea"
    >


      <h1
        id="name"
        class="name"
      >

        Thank you!

      </h1>


      <div class="line"></div>


      <div
        class="message-wrapper"
        id="messageWrapper"
      >

        <p
          id="message"
          class="message"
        >

          メッセージを読み込んでいます。

        </p>

      </div>


      <div class="message-footer">

        THANK YOU FOR CELEBRATING WITH US

      </div>


    </section>


  </main>


  <!-- =====================================
       ゲストデータ
  ====================================== -->

  <script src="guests.js"></script>


  <script>


    /* =====================================
       URLからID取得
    ===================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* =====================================
       ゲストごとの背景色
    ===================================== */

    const backgroundColors = [

      "#F3E9DD",
      "#EEE9E1",
      "#E7EDE8",
      "#E8EDF1",
      "#F2E8D5",
      "#EEE7EE",
      "#E9E4DC",
      "#E5ECE9"

    ];


    function getBackgroundColor(id) {


      if (!id) {

        return backgroundColors[0];

      }


      let number = 0;


      for (
        let i = 0;
        i < id.length;
        i++
      ) {

        number +=
          id.charCodeAt(i);

      }


      return backgroundColors[
        number %
        backgroundColors.length
      ];

    }


    const guestBackground =
      getBackgroundColor(id);


    document.body.style.backgroundColor =
      guestBackground;


    document.getElementById(
      "messageArea"
    ).style.backgroundColor =
      guestBackground;


    /* =====================================
       写真設定
    ===================================== */

    function setPhoto(
      imageId,
      cardId,
      photoPath
    ) {


      const image =
        document.getElementById(
          imageId
        );


      const card =
        document.getElementById(
          cardId
        );


      if (photoPath) {

        image.src =
          photoPath;

        card.classList.remove(
          "hidden"
        );

      } else {

        card.classList.add(
          "hidden"
        );

      }

    }


    /* =====================================
       ゲスト情報
    ===================================== */

    if (
      id &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* 名前 */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* メッセージ */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* 写真① */

      setPhoto(
        "photo1",
        "card1",
        guest.photos[0]
      );


      /* 写真② */

      setPhoto(
        "photo2",
        "card2",
        guest.photos[1]
      );


      /* 写真③ */

      setPhoto(
        "photo3",
        "card3",
        guest.photos[2]
      );


      /* コピー① */

      setPhoto(
        "photo1copy",
        "card1copy",
        guest.photos[0]
      );


      /* コピー② */

      setPhoto(
        "photo2copy",
        "card2copy",
        guest.photos[1]
      );


      /* コピー③ */

      setPhoto(
        "photo3copy",
        "card3copy",
        guest.photos[2]
      );


    } else {


      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.querySelectorAll(
        ".photo-card"
      ).forEach(
        card => {

          card.classList.add(
            "hidden"
          );

        }
      );

    }


    /* =====================================
       写真スクロール
    ===================================== */

    const photoArea =
      document.getElementById(
        "photoArea"
      );


    const photoTrack =
      document.getElementById(
        "photoTrack"
      );


    let position = 0;

    /*
      自動スクロール速度
    */

    let velocity = 0.55;

    let isDragging = false;

    let startX = 0;

    let startPosition = 0;


    /* =====================================
       ループ幅
    ===================================== */

    function getLoopWidth() {


      const cards =
        photoTrack.querySelectorAll(
          ".photo-card"
        );


      if (cards.length < 6) {

        return 0;

      }


      return (
        cards[3].offsetLeft -
        cards[0].offsetLeft
      );

    }


    /* =====================================
       写真位置更新
    ===================================== */

    function updatePhotoPosition() {


      const loopWidth =
        getLoopWidth();


      if (!loopWidth) {

        return;

      }


      if (!isDragging) {

        position -= velocity;

      }


      if (
        position <=
        -loopWidth
      ) {

        position +=
          loopWidth;

      }


      if (
        position > 0
      ) {

        position -=
          loopWidth;

      }


      photoTrack.style.transform =
        `translate3d(${position}px, -50%, 0)`;

    }


    /* =====================================
       アニメーション
    ===================================== */

    function animate() {

      updatePhotoPosition();

      requestAnimationFrame(
        animate
      );

    }


    requestAnimationFrame(
      animate
    );


    /* =====================================
       スマホ：タッチ開始
    ===================================== */

    photoArea.addEventListener(
      "touchstart",
      function(event) {


        if (
          event.touches.length !== 1
        ) {

          return;

        }


        isDragging = true;


        startX =
          event.touches[0].clientX;


        startPosition =
          position;

      },
      {
        passive: true
      }
    );


    /* =====================================
       スマホ：スワイプ
    ===================================== */

    photoArea.addEventListener(
      "touchmove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const deltaX =
          currentX - startX;


        position =
          startPosition + deltaX;


        const loopWidth =
          getLoopWidth();


        if (loopWidth) {


          if (
            position <=
            -loopWidth
          ) {

            position +=
              loopWidth;

            startPosition +=
              loopWidth;

          }


          if (
            position > 0
          ) {

            position -=
              loopWidth;

            startPosition -=
              loopWidth;

          }

        }


      },
      {
        passive: true
      }
    );


    /* =====================================
       スマホ：指を離す
    ===================================== */

    photoArea.addEventListener(
      "touchend",
      function() {

        isDragging = false;

      }
    );


    photoArea.addEventListener(
      "touchcancel",
      function() {

        isDragging = false;

      }
    );


    /* =====================================
       PC：マウス操作
    ===================================== */

    photoArea.addEventListener(
      "mousedown",
      function(event) {


        isDragging = true;


        startX =
          event.clientX;


        startPosition =
          position;

      }
    );


    window.addEventListener(
      "mousemove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const deltaX =
          event.clientX - startX;


        position =
          startPosition + deltaX;

      }
    );


    window.addEventListener(
      "mouseup",
      function() {

        isDragging = false;

      }
    );


  </script>


</body>
</html>
