<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Memory Ticket</title>


  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Parisienne&family=Klee+One&family=Libre+Baskerville&family=Noto+Serif+JP:wght@400;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ==================================================
       基本設定
    ================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #11110f;

      color: #f5f1e7;

    }


    body {

      font-family:
        "Noto Serif JP",
        serif;

      -webkit-font-smoothing:
        antialiased;

    }


    /* ==================================================
       ページ本体
    ================================================== */

    .page {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

      background: #11110f;

    }


    /* ==================================================
       外側フレーム
    ================================================== */

    .ticket-frame {

      position: absolute;

      inset: 1px;

      border:
        2px solid
        rgba(245,241,231,0.7);

      pointer-events: none;

      z-index: 100;

    }


    .ticket-frame::before {

      content: "";

      position: absolute;

      inset: 7px;

      border:
        1.5px dashed
        rgba(245,241,231,0.38);

    }


    /* ==================================================
       メッセージ左右の縦ミシン目
    ================================================== */

    .message-perforation {

      position: absolute;

      top: 5px;
      bottom: 5px;

      width: 1px;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(245,241,231,0.28) 0,
          rgba(245,241,231,0.28) 3px,
          transparent 3px,
          transparent 9px
        );

      z-index: 99;

      pointer-events: none;

    }


    .message-perforation.left {
      left: 7px;
    }


    .message-perforation.right {
      right: 7px;
    }


    /* ==================================================
       四隅
    ================================================== */

    .corner {

      position: absolute;

      width: 26px;
      height: 26px;

      background: #11110f;

      border:
        1px solid
        rgba(245,241,231,0.7);

      z-index: 101;

    }


    .corner.tl {

      top: -2px;
      left: -2px;

      border-radius:
        0 0 24px 0;

      border-top: none;
      border-left: none;

    }


    .corner.tr {

      top: -2px;
      right: -2px;

      border-radius:
        0 0 0 24px;

      border-top: none;
      border-right: none;

    }


    .corner.bl {

      bottom: -2px;
      left: -2px;

      border-radius:
        0 24px 0 0;

      border-bottom: none;
      border-left: none;

    }


    .corner.br {

      bottom: -2px;
      right: -2px;

      border-radius:
        24px 0 0 0;

      border-bottom: none;
      border-right: none;

    }


    /* ==================================================
       中央のもぎり
       ※ Thank you ラベルは削除
    ================================================== */

    .tear-notch {

      position: absolute;

      top: calc(46% - 8px);

      width: 30px;
      height: 30px;

      border-radius: 50%;

      background: #11110f;

      border:
        1px solid
        rgba(245,241,231,0.7);

      transform:
        translateY(-50%);

      z-index: 110;

      pointer-events: none;

    }


    .tear-notch.left {
      left: -16px;
    }


    .tear-notch.right {
      right: -16px;
    }


    /* 中央の線もかなり薄く */

    .tear-line {

      position: absolute;

      top: calc(46% - 8px);

      left: 24px;
      right: 24px;

      height: 0;

      border-top:
        1px dashed
        rgba(245,241,231,0.28);

      transform:
        translateY(-50%);

      z-index: 105;

      pointer-events: none;

    }


    /* ==================================================
       中央ラベル削除
    ================================================== */

    .tear-label {
      display: none;
    }


    /* ==================================================
       メインコンテンツ
    ================================================== */

    .content {

      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    /* ==================================================
       上部：フィルムエリア
       少し狭くした
    ================================================== */

    .film-section {

      position: relative;

      width: calc(100% - 14px);

      /*
       * 以前より少し高さを縮小
       */
      height: calc(46% - 38px);

      margin-left: 7px;

      top: 30px;

      overflow: hidden;

      background: #252624;

      border-bottom:
        1px solid
        rgba(245,241,231,0.18);

      z-index: 10;

    }


    /* ==================================================
       フィルム穴
    ================================================== */

    .film-holes {

      position: absolute;

      left: 0;
      right: 0;

      height: 17px;

      z-index: 20;

      display: flex;

      align-items: center;

      justify-content: space-around;

      overflow: hidden;

      pointer-events: none;

    }


    .film-holes.top {
      top: 8px;
    }


    .film-holes.bottom {
      bottom: 8px;

      display: flex;

      z-index: 200;

    }


    .film-hole {

      flex:
        0 0 13px;

      width: 13px;
      height: 9px;

      min-width: 13px;
      min-height: 9px;

      border-radius: 2px;

      background: #f5f1e7;

      opacity: 0.92;

    }


    .film-line {
      display: none;
    }


    /* ==================================================
       写真表示領域
       ※ フィルムのど真ん中に配置
    ================================================== */

    .photo-window {

      position: absolute;

      left: 0;
      right: 0;

      /*
       * 上下中央
       */
      top: 50%;

      height: 70%;

      transform:
        translateY(-50%);

      overflow: hidden;

      z-index: 10;

      touch-action: pan-y;

    }


    .photo-track {

      position: absolute;

      top: 50%;
      left: 0;

      height: 100%;

      display: flex;

      align-items: center;

      gap: 18px;

      width: max-content;

      transform:
        translate3d(
          0,
          -50%,
          0
        );

      will-change: transform;

      user-select: none;

      -webkit-user-select: none;

      cursor: grab;

    }


    .photo-track.dragging {
      cursor: grabbing;
    }


    /* ==================================================
       写真
    ================================================== */

    .photo-card {

      position: relative;

      flex:
        0 0 auto;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .photo-card img {

      display: block;

      height: 100%;

      width: auto;

      max-width: 61vw;

      object-fit: contain;

      border-radius: 2px;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.45);

      pointer-events: none;

      -webkit-user-drag: none;

    }


    .film-mark {
      display: none;
    }


    /* ==================================================
       下部メッセージエリア
    ================================================== */

    .message-section {

      position: relative;

      width: 100%;

      /*
       * 上部を縮めた分、
       * 下部を少し広めに
       */
      height: calc(54% - 10px);

      top: 25px;

      padding:
        24px 3px 0;

      background: #11110f;

      overflow: hidden;

    }


    /* ==================================================
       メッセージカード
    ================================================== */

    .message-card {

      position: relative;

      width: 100%;
      height: 100%;

      border:
        1px solid
        rgba(245,241,231,0.58);

      padding:
        10px 18px 8px;

      overflow: hidden;

      background: #11110f;

    }


    /* ==================================================
       メッセージカードの質感
    ================================================== */

    .message-card::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 20% 20%,
          rgba(245,241,231,0.035),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 80% 70%,
          rgba(245,241,231,0.025),
          transparent 50%
        ),
        radial-gradient(
          rgba(245,241,231,0.025) 0.5px,
          transparent 0.8px
        );

      background-size:
        auto,
        auto,
        5px 5px;

      opacity: 0.7;

      z-index: 1;

    }


    /* ==================================================
       上部文字は削除
    ================================================== */

    .eyebrow {
      display: none;
    }


    /* ==================================================
       宛名
       少し小さく
    ================================================== */

    .guest-name {

      position: relative;

      z-index: 3;

      margin: 0;

      font-family:
        "Klee One",
        cursive;

      font-size: 18px;

      font-weight: 600;

      letter-spacing: 0.08em;

      line-height: 1.5;

      color: #f5f1e7;

      opacity: 0;

      animation:
        fadeInUp 1.4s ease 0.35s forwards;

    }


    .guest-name.english {

      font-family:
        "Parisienne",
        cursive !important;

      letter-spacing: 0;

      font-weight: 400;

      font-size: 27px;

    }


    /* ==================================================
       宛名下ライン
    ================================================== */

    .name-line {

      position: relative;

      z-index: 3;

      width: 85px;

      height: 1px;

      margin:
        7px 0 14px;

      background:
        rgba(245,241,231,0.5);

    }


    /* ==================================================
       メッセージスクロール
    ================================================== */

    .message-scroll {

      position: relative;

      z-index: 3;

      height:
        calc(100% - 65px);

      overflow-y: auto;

      padding-right: 5px;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: none;

      opacity: 0;

      animation:
        fadeInUp 1.6s ease 0.7s forwards;

    }


    .message-scroll::-webkit-scrollbar {
      display: none;
    }


    /* ==================================================
       サイン
    ================================================== */

    .message-signature {

      text-align: right;

      padding:
        8px 5px 20px 0;

      font-family:
        "Parisienne",
        cursive;

      font-size: 24px;

      color: #f5f1e7;

      opacity: 0;

      transform:
        translateY(5px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;

    }


    .message-scroll.reached-bottom
    .message-signature {

      opacity: 1;

      transform:
        translateY(0);

    }


    /* ==================================================
       本文
    ================================================== */

    .message {

      margin: 0;

      padding-bottom: 20px;

      font-family:
        "Klee One",
        "Noto Serif JP",
        serif;

      font-size: 14px;

      line-height: 2.05;

      letter-spacing: 0.045em;

      white-space: pre-line;

      color: #f5f1e7;

    }


    /* ==================================================
       下部情報
       1行に変更
    ================================================== */

    .message-bottom {

      position: absolute;

      left: 24px;
      right: 24px;

      bottom: 14px;

      z-index: 4;

      display: flex;

      align-items: center;

      justify-content: space-between;

    }


    .wedding-mark {

      font-family:
        "Libre Baskerville",
        serif;

      font-size: 7px;

      line-height: 1;

      letter-spacing: 0.12em;

      color:
        rgba(245,241,231,0.68);

      white-space: nowrap;

    }


    .thank-you {

      font-family:
        "Libre Baskerville",
        serif;

      font-size: 7px;

      line-height: 1;

      letter-spacing: 0.11em;

      text-align: right;

      color:
        rgba(245,241,231,0.68);

      white-space: nowrap;

    }


    /* ==================================================
       下部点線
    ================================================== */

    .bottom-dash {

      position: absolute;

      left: 24px;
      right: 24px;

      bottom: 5px;

      height: 1px;

      background:
        repeating-linear-gradient(
          to right,
          rgba(245,241,231,0.38) 0,
          rgba(245,241,231,0.38) 8px,
          transparent 8px,
          transparent 15px
        );

      z-index: 4;

    }


    /* ==================================================
       ハート
    ================================================== */

    .little-heart {

      position: absolute;

      left: 50%;

      bottom: 13px;

      transform:
        translateX(-50%);

      z-index: 6;

      color:
        rgba(245,241,231,0.55);

      font-size: 11px;

    }


    /* ==================================================
       フェードイン
    ================================================== */

    @keyframes fadeInUp {

      from {

        opacity: 0;

        transform:
          translateY(10px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* ==================================================
       スマホ小画面
    ================================================== */

    @media (max-height: 700px) {

      .film-section {

        min-height: 250px;

      }


      .message-section {

        padding:
          20px 3px 15px;

      }


      .message-card {

        padding:
          14px 18px 13px;

      }


      .guest-name {

        font-size: 18px;

      }


      .guest-name.english {

        font-size: 26px;

      }


      .message {

        font-size: 13px;

        line-height: 1.95;

      }


      .name-line {

        margin:
          5px 0 10px;

      }

    }


    /* ==================================================
       PC
    ================================================== */

    @media (min-width: 700px) {

      body {

        padding:
          20px 0;

      }


      .page {

        height: 850px;

        border-radius: 12px;

        box-shadow:
          0 15px 50px
          rgba(0,0,0,0.45);

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- 外側フレーム -->

    <div class="ticket-frame">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>


    <!-- 中央境界 -->

    <div class="tear-line"></div>

    <div class="tear-label">
      Thank you
    </div>

    <div class="tear-notch left"></div>
    <div class="tear-notch right"></div>

    <div class="message-perforation left"></div>
    <div class="message-perforation right"></div>


    <div class="content">


      <!-- =================================================
           写真・フィルムエリア
      ================================================== -->

      <section class="film-section">


        <div
          class="film-holes top"
          id="holesTop"
        ></div>


        <div
          class="film-holes bottom"
          id="holesBottom"
        ></div>


        <div class="film-line top"></div>
        <div class="film-line bottom"></div>


        <div
          class="photo-window"
          id="photoWindow"
        >

          <div
            class="photo-track"
            id="photoTrack"
          ></div>

        </div>


      </section>


      <!-- =================================================
           メッセージエリア
      ================================================== -->

      <section class="message-section">


        <div class="message-card">


          <h1
            id="name"
            class="guest-name"
          >
            Thank you!
          </h1>


          <div class="name-line"></div>


          <div
            class="message-scroll"
            id="messageScroll"
          >

            <p
              id="message"
              class="message"
            >
              メッセージを読み込んでいます。
            </p>


            <div
              class="message-signature"
              id="messageSignature"
            >
              Rin
            </div>

          </div>


          <!-- 下部情報 -->

          <div class="message-bottom">


            <div class="wedding-mark">

              THANK YOU FOR COMING

            </div>


            <div class="thank-you">

              7 NOV 2026

            </div>


          </div>


          <div class="little-heart">
            ♥
          </div>


          <div class="bottom-dash"></div>


        </div>


      </section>


    </div>


  </main>


  <!-- ==================================================
       ゲストデータ
    ================================================== -->

  <script src="guests.js"></script>


  <script>

    /* ==================================================
       WorkerのURL
    ================================================== */

    const WORKER_URL =
      "https://wedding-memory-worker.rinkawamura1012.workers.dev";


    /* ==================================================
       URLからID取得
    ================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* ==================================================
       フィルム穴生成
    ================================================== */

    function createFilmHoles() {

      const top =
        document.getElementById(
          "holesTop"
        );


      const bottom =
        document.getElementById(
          "holesBottom"
        );


      const count =
        Math.ceil(
          window.innerWidth / 23
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const hole1 =
          document.createElement(
            "div"
          );

        hole1.className =
          "film-hole";


        const hole2 =
          document.createElement(
            "div"
          );

        hole2.className =
          "film-hole";


        top.appendChild(
          hole1
        );

        bottom.appendChild(
          hole2
        );

      }

    }


    createFilmHoles();


    /* ==================================================
       写真URL
    ================================================== */

    function createPhotoUrl(path) {

      const safePath =
        path
          .split("/")
          .map(
            part =>
              encodeURIComponent(part)
          )
          .join("/");


      return (
        WORKER_URL +
        "/" +
        safePath
      );

    }


    /* ==================================================
       写真カード生成
    ================================================== */

    function createPhotoCards(photos) {

      const track =
        document.getElementById(
          "photoTrack"
        );


      track.innerHTML = "";


      if (
        !Array.isArray(photos) ||
        photos.length === 0
      ) {

        return;

      }


      photos.forEach(
        function(photo) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "photo-card";


          const image =
            document.createElement(
              "img"
            );


          image.src =
            createPhotoUrl(
              photo
            );

          image.alt = "";


          card.appendChild(
            image
          );


          track.appendChild(
            card
          );

        }
      );


      photos.forEach(
        function(photo) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "photo-card";


          const image =
            document.createElement(
              "img"
            );


          image.src =
            createPhotoUrl(
              photo
            );

          image.alt = "";


          card.appendChild(
            image
          );


          track.appendChild(
            card
          );

        }
      );

    }


    /* ==================================================
       ゲスト情報
    ================================================== */

    async function loadGuest() {

      if (!id) {

        document.getElementById(
          "name"
        ).textContent =
          "Welcome!";


        document.getElementById(
          "message"
        ).textContent =
          "QRコードからアクセスしてください。";


        return;

      }


      if (
        typeof guests !== "undefined" &&
        guests[id]
      ) {

        const guest =
          guests[id];


        const nameElement =
          document.getElementById(
            "name"
          );


        nameElement.textContent =
          guest.name;


        if (
          !/[\u3040-\u30ff\u3400-\u9fff]/.test(
            guest.name
          )
        ) {

          nameElement.classList.add(
            "english"
          );

        }


        document.getElementById(
          "message"
        ).textContent =
          guest.message;

      }


      /* ==================================================
         メッセージ末尾でRin表示
      ================================================== */

      const messageScroll =
        document.getElementById(
          "messageScroll"
        );


      function checkMessageScroll() {

        const isAtBottom =
          messageScroll.scrollTop +
          messageScroll.clientHeight >=
          messageScroll.scrollHeight - 5;


        if (isAtBottom) {

          messageScroll.classList.add(
            "reached-bottom"
          );

        }

      }


      messageScroll.addEventListener(
        "scroll",
        checkMessageScroll
      );


      checkMessageScroll();


      /* ==================================================
         Workerから写真一覧
      ================================================== */

      try {

        const response =
          await fetch(
            WORKER_URL +
            "/" +
            encodeURIComponent(id) +
            "/"
          );


        if (!response.ok) {

          throw new Error(
            `Worker error: ${response.status}`
          );

        }


        const data =
          await response.json();


        console.log(
          "Workerから取得した写真:",
          data.photos
        );


        createPhotoCards(
          data.photos
        );


      } catch (error) {

        console.error(
          "写真の取得に失敗しました:",
          error
        );

      }

    }


    loadGuest();


    /* ==================================================
       写真自動スクロール
    ================================================== */

    const track =
      document.getElementById(
        "photoTrack"
      );


    const windowArea =
      document.getElementById(
        "photoWindow"
      );


    let position = 0;

    let velocity = 0.38;

    let dragging = false;

    let startX = 0;

    let startPosition = 0;


    /* ==================================================
       1セット分の幅
    ================================================== */

    function getLoopWidth() {

      const cards =
        track.querySelectorAll(
          ".photo-card"
        );


      const totalCards =
        cards.length;


      if (
        totalCards < 2
      ) {

        return 0;

      }


      const half =
        totalCards / 2;


      if (
        !Number.isInteger(half)
      ) {

        return 0;

      }


      return (
        cards[half].offsetLeft -
        cards[0].offsetLeft
      );

    }


    /* ==================================================
       アニメーション
    ================================================== */

    function animate() {

      const loopWidth =
        getLoopWidth();


      if (
        !dragging &&
        loopWidth
      ) {

        position -= velocity;


        if (
          position <= -loopWidth
        ) {

          position +=
            loopWidth;

        }

      }


      track.style.transform =
        `translate3d(
          ${position}px,
          -50%,
          0
        )`;


      requestAnimationFrame(
        animate
      );

    }


    requestAnimationFrame(
      animate
    );


    /* ==================================================
       タッチ操作
    ================================================== */

    windowArea.addEventListener(
      "touchstart",
      function(event) {

        if (
          event.touches.length !== 1
        ) {

          return;

        }


        dragging = true;


        track.classList.add(
          "dragging"
        );


        startX =
          event.touches[0].clientX;


        startPosition =
          position;

      },
      {
        passive: true
      }
    );


    windowArea.addEventListener(
      "touchmove",
      function(event) {

        if (!dragging) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const delta =
          currentX -
          startX;


        position =
          startPosition +
          delta;


        const loopWidth =
          getLoopWidth();


        if (
          loopWidth &&
          position <= -loopWidth
        ) {

          position +=
            loopWidth;

          startPosition +=
            loopWidth;

        }


        if (
          loopWidth &&
          position > 0
        ) {

          position -=
            loopWidth;

          startPosition -=
            loopWidth;

        }

      },
      {
        passive: true
      }
    );


    windowArea.addEventListener(
      "touchend",
      function() {

        dragging = false;

        track.classList.remove(
          "dragging"
        );

      }
    );


    /* ==================================================
       PCマウス操作
    ================================================== */

    windowArea.addEventListener(
      "mousedown",
      function(event) {

        dragging = true;

        track.classList.add(
          "dragging"
        );


        startX =
          event.clientX;


        startPosition =
          position;

      }
    );


    window.addEventListener(
      "mousemove",
      function(event) {

        if (!dragging) {

          return;

        }


        position =
          startPosition +
          (
            event.clientX -
            startX
          );


        const loopWidth =
          getLoopWidth();


        if (
          loopWidth &&
          position <= -loopWidth
        ) {

          position +=
            loopWidth;

          startPosition +=
            loopWidth;

        }


        if (
          loopWidth &&
          position > 0
        ) {

          position -=
            loopWidth;

          startPosition -=
            loopWidth;

        }

      }
    );


    window.addEventListener(
      "mouseup",
      function() {

        dragging = false;

        track.classList.remove(
          "dragging"
        );

      }
    );

  </script>


</body>

</html>
