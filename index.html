<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wedding Message</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;

      color: #333;

      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      transition: background-color 0.5s ease;
    }


    /* =================================
       全体
    ================================= */

    .screen {
      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

      background: transparent;
    }


    /* =================================
       写真共通
    ================================= */

    .photo {
      position: absolute;

      display: block;

      width: auto;
      height: auto;

      object-fit: contain;

      border: 5px solid rgba(255, 255, 255, 0.95);

      border-radius: 2px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.16);

      z-index: 1;
    }


    /* =================================
       写真①
       左上・小さめ
    ================================= */

    .photo-1 {

      top: 4%;
      left: 3%;

      max-width: 43%;
      max-height: 31%;

      z-index: 2;
    }


    /* =================================
       写真②
       メイン写真
       中央寄り・大きめ
    ================================= */

    .photo-2 {

      top: 7%;
      right: 2%;

      max-width: 68%;
      max-height: 43%;

      z-index: 1;
    }


    /* =================================
       写真③
       下側
    ================================= */

    .photo-3 {

      bottom: 7%;
      right: 3%;

      max-width: 57%;
      max-height: 31%;

      z-index: 2;
    }


    /* =================================
       中央メッセージカード
    ================================= */

    .message-card {

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 76%;
      max-width: 460px;

      max-height: 51%;

      padding: 28px 25px;

      /*
        かなり透けるように設定
      */

      background:
        rgba(255, 255, 255, 0.64);

      border:
        1px solid rgba(255, 255, 255, 0.85);

      border-radius: 20px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.12);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      text-align: center;

      z-index: 10;

      overflow: hidden;
    }


    /* =================================
       名前
    ================================= */

    .name {

      margin: 0 0 13px;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        cursive;

      font-size: 29px;

      font-weight: 500;

      letter-spacing: 0.12em;

      color: #303030;
    }


    /* =================================
       飾り線
    ================================= */

    .line {

      width: 48px;

      height: 1px;

      margin: 0 auto 17px;

      background:
        rgba(80, 70, 60, 0.45);
    }


    /* =================================
       メッセージ
    ================================= */

    .message-wrapper {

      max-height: 25vh;

      overflow-y: auto;

      padding: 0 4px;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;
    }


    .message {

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        cursive;

      font-size: 16px;

      line-height: 2;

      letter-spacing: 0.04em;

      white-space: pre-line;

      color: #333;
    }


    /* =================================
       下部
    ================================= */

    .footer {

      position: absolute;

      left: 0;
      bottom: 2.2%;

      width: 100%;

      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 10px;

      letter-spacing: 0.15em;

      color:
        rgba(80, 70, 60, 0.7);

      z-index: 20;
    }


    /* =================================
       写真がない場合
    ================================= */

    .hidden {
      display: none;
    }


    /* =================================
       小さいスマホ
    ================================= */

    @media (max-height: 700px) {

      .photo-1 {
        max-height: 28%;
      }

      .photo-2 {
        max-height: 38%;
      }

      .photo-3 {
        max-height: 27%;
      }

      .message-card {

        width: 78%;

        padding:
          22px 19px;
      }

      .name {

        font-size: 24px;

        margin-bottom: 10px;
      }

      .message-wrapper {

        max-height: 23vh;
      }

      .message {

        font-size: 14px;

        line-height: 1.85;
      }
    }


    /* =================================
       PC
    ================================= */

    @media (min-width: 700px) {

      body {
        padding-top: 20px;
      }

      .screen {

        height: 850px;

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(0, 0, 0, 0.12);
      }
    }

  </style>
</head>


<body>

  <main class="screen">


    <!-- =============================
         写真
    ============================== -->

    <img
      id="photo1"
      class="photo photo-1"
      src=""
      alt="思い出の写真"
    >

    <img
      id="photo2"
      class="photo photo-2"
      src=""
      alt="思い出の写真"
    >

    <img
      id="photo3"
      class="photo photo-3"
      src=""
      alt="思い出の写真"
    >


    <!-- =============================
         メッセージ
    ============================== -->

    <section class="message-card">

      <h1
        id="name"
        class="name"
      >
        Thank you!
      </h1>

      <div class="line"></div>

      <div class="message-wrapper">

        <p
          id="message"
          class="message"
        >
          メッセージを読み込んでいます。
        </p>

      </div>

    </section>


    <!-- =============================
         フッター
    ============================== -->

    <div class="footer">
      THANK YOU FOR CELEBRATING WITH US
    </div>

  </main>


  <!-- =============================
       ゲスト情報
  ============================== -->

  <script src="guests.js"></script>


  <!-- =============================
       表示処理
  ============================== -->

  <script>

    /* URLからID取得 */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get("id");


    /* =================================
       背景色
    ================================= */

    const backgroundColors = [

      "#F3E9DD",
      "#EDE8DF",
      "#E8EDE7",
      "#E8EDF1",
      "#F0E7D5",
      "#EEE7EE",
      "#E9E4DA",
      "#E5ECE9"

    ];


    /*
      IDごとに背景色を固定
    */

    function getBackgroundColor(id) {

      if (!id) {

        return backgroundColors[0];

      }

      let number = 0;

      for (
        let i = 0;
        i < id.length;
        i++
      ) {

        number +=
          id.charCodeAt(i);

      }

      return backgroundColors[
        number %
        backgroundColors.length
      ];
    }


    document.body.style.backgroundColor =
      getBackgroundColor(id);


    /* =================================
       写真表示
    ================================= */

    function setPhoto(
      elementId,
      photoPath
    ) {

      const photo =
        document.getElementById(
          elementId
        );


      if (photoPath) {

        photo.src =
          photoPath;

        photo.classList.remove(
          "hidden"
        );

      } else {

        photo.classList.add(
          "hidden"
        );

      }
    }


    /* =================================
       ゲスト表示
    ================================= */

    if (
      id &&
      guests[id]
    ) {

      const guest =
        guests[id];


      /*
        名前
      */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /*
        メッセージ
      */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /*
        写真
      */

      setPhoto(
        "photo1",
        guest.photos[0]
      );


      setPhoto(
        "photo2",
        guest.photos[1]
      );


      setPhoto(
        "photo3",
        guest.photos[2]
      );


    } else {


      /*
        IDなし
      */

      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.getElementById(
        "photo1"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo2"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo3"
      ).classList.add(
        "hidden"
      );

    }

  </script>

</body>
</html>
