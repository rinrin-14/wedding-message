<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Message</title>


  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

    }


    body {

      overflow: hidden;

      color: #333;

      /*
        手書きっぽい日本語フォントを優先。
        iPhoneなどで利用できるフォントを順番に指定。
      */

      font-family:
        "Klee One",
        "Hannotate SC",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        cursive;

      transition:
        background-color 0.5s ease;

    }


    /* =========================================
       メイン画面
    ========================================= */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

    }


    /* =========================================
       写真共通
    ========================================= */

    .photo {

      position: absolute;

      display: block;

      /*
        縦横比を絶対に崩さない
      */

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 7px;

      box-shadow:
        0 8px 26px rgba(0, 0, 0, 0.15);

      /*
        写真そのものは回転させない
      */

      transform: none;

    }


    /* =========================================
       写真①
       左上
    ========================================= */

    .photo-1 {

      /*
        横幅基準。
        縦写真の場合は自然に高さが決まる。
      */

      width: 55%;

      max-height: 35%;

      top: 6%;

      left: 3%;

      z-index: 2;

    }


    /* =========================================
       写真②
       右上〜中央
       今回の主役
    ========================================= */

    .photo-2 {

      width: 58%;

      max-height: 39%;

      /*
        前回より少し下げて、
        中央カードに食い込ませる
      */

      top: 13%;

      right: 2%;

      z-index: 4;

    }


    /* =========================================
       写真③
       右下
       写真①との対角配置
    ========================================= */

    .photo-3 {

      width: 52%;

      max-height: 31%;

      bottom: 7%;

      right: 7%;

      z-index: 2;

    }


    /* =========================================
       中央メッセージカード
    ========================================= */

    .message-card {

      position: absolute;

      width: 72%;

      max-width: 430px;

      /*
        前回より高さを抑える
      */

      max-height: 43%;

      top: 51%;

      left: 50%;

      transform:
        translate(-50%, -50%);


      /*
        透明度高め
      */

      background:
        rgba(255, 255, 255, 0.56);


      border:
        1px solid
        rgba(255, 255, 255, 0.78);


      border-radius: 20px;


      padding:
        25px 24px 24px;


      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.09);


      /*
        背後の写真を少しだけぼかす
      */

      backdrop-filter:
        blur(3px);

      -webkit-backdrop-filter:
        blur(3px);


      text-align: center;


      /*
        写真より前面
      */

      z-index: 10;

    }


    /* =========================================
       名前
    ========================================= */

    .name {

      margin:
        0 0 12px;

      font-family:
        "Klee One",
        "Hannotate SC",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 28px;

      font-weight: 600;

      letter-spacing: 0.08em;

      line-height: 1.4;

    }


    /* =========================================
       区切り線
    ========================================= */

    .line {

      width: 42px;

      height: 1px;

      margin:
        0 auto 15px;

      background:
        rgba(60, 60, 60, 0.40);

    }


    /* =========================================
       メッセージスクロール領域
    ========================================= */

    .message-wrapper {

      /*
        普段はここに収まる。

        長文になった場合だけ
        この部分をスクロール。
      */

      max-height: 23vh;

      overflow-y: auto;

      padding:
        0 5px;


      -webkit-overflow-scrolling:
        touch;


      /*
        スクロールバーを隠す
      */

      scrollbar-width: none;

    }


    .message-wrapper::-webkit-scrollbar {

      display: none;

    }


    /* =========================================
       メッセージ本文
    ========================================= */

    .message {

      margin: 0;

      font-family:
        "Klee One",
        "Hannotate SC",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 15px;

      font-weight: 400;

      line-height: 2;

      letter-spacing: 0.045em;

      white-space: pre-line;

    }


    /* =========================================
       フッター
    ========================================= */

    .footer {

      position: absolute;

      bottom: 1.5%;

      left: 0;

      width: 100%;

      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 9px;

      letter-spacing: 0.15em;

      color:
        rgba(60, 60, 60, 0.58);

      z-index: 20;

    }


    /* =========================================
       写真がない場合
    ========================================= */

    .hidden {

      display: none;

    }


    /* =========================================
       小さいスマホ
    ========================================= */

    @media (max-height: 700px) {


      .photo-1 {

        width: 53%;

        max-height: 33%;

        top: 5%;

      }


      .photo-2 {

        width: 56%;

        max-height: 37%;

        top: 12%;

      }


      .photo-3 {

        width: 50%;

        max-height: 29%;

        bottom: 6%;

      }


      .message-card {

        width: 75%;

        max-height: 42%;

        padding:
          21px 19px 20px;

      }


      .name {

        font-size: 24px;

        margin-bottom: 10px;

      }


      .line {

        margin-bottom: 12px;

      }


      .message-wrapper {

        max-height: 21vh;

      }


      .message {

        font-size: 13px;

        line-height: 1.85;

      }


      .footer {

        font-size: 8px;

      }

    }


    /* =========================================
       PC
    ========================================= */

    @media (min-width: 700px) {


      .screen {

        height: 850px;

        margin-top: 20px;

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(0, 0, 0, 0.12);

      }

    }

  </style>

</head>


<body>


  <main class="screen">


    <!-- =====================================
         写真①
    ====================================== -->

    <img
      id="photo1"
      class="photo photo-1"
      src=""
      alt="思い出の写真"
    >


    <!-- =====================================
         写真②
    ====================================== -->

    <img
      id="photo2"
      class="photo photo-2"
      src=""
      alt="思い出の写真"
    >


    <!-- =====================================
         写真③
    ====================================== -->

    <img
      id="photo3"
      class="photo photo-3"
      src=""
      alt="思い出の写真"
    >


    <!-- =====================================
         中央メッセージ
    ====================================== -->

    <section class="message-card">


      <h1
        id="name"
        class="name"
      >
        Thank you!
      </h1>


      <div class="line"></div>


      <div class="message-wrapper">

        <p
          id="message"
          class="message"
        >
          メッセージを読み込んでいます。
        </p>

      </div>


    </section>


    <!-- =====================================
         フッター
    ====================================== -->

    <div class="footer">

      THANK YOU FOR CELEBRATING WITH US

    </div>


  </main>


  <!-- =======================================
       ゲストデータ
  ======================================== -->

  <script src="guests.js"></script>


  <!-- =======================================
       表示処理
  ======================================== -->

  <script>


    /* ---------------------------------------
       URLからIDを取得
    --------------------------------------- */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* ---------------------------------------
       背景色
       IDごとに固定
    --------------------------------------- */

    const backgroundColors = [

      "#F3E9DD",
      "#EEE9E1",
      "#E7EDE8",
      "#E8EDF1",
      "#F2E8D5",
      "#EEE7EE",
      "#E9E4DC",
      "#E5ECE9"

    ];


    function getBackgroundColor(id) {


      if (!id) {

        return backgroundColors[0];

      }


      let number = 0;


      for (
        let i = 0;
        i < id.length;
        i++
      ) {

        number +=
          id.charCodeAt(i);

      }


      return backgroundColors[
        number %
        backgroundColors.length
      ];

    }


    document.body.style.backgroundColor =
      getBackgroundColor(id);


    /* ---------------------------------------
       写真を表示する関数
    --------------------------------------- */

    function setPhoto(
      elementId,
      photoPath
    ) {


      const photo =
        document.getElementById(
          elementId
        );


      if (photoPath) {

        photo.src =
          photoPath;

        photo.classList.remove(
          "hidden"
        );

      } else {

        photo.classList.add(
          "hidden"
        );

      }

    }


    /* ---------------------------------------
       ゲスト情報を表示
    --------------------------------------- */

    if (
      id &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* 名前 */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* メッセージ */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* 写真① */

      setPhoto(
        "photo1",
        guest.photos[0]
      );


      /* 写真② */

      setPhoto(
        "photo2",
        guest.photos[1]
      );


      /* 写真③ */

      setPhoto(
        "photo3",
        guest.photos[2]
      );


    }


    /* ---------------------------------------
       IDが存在しない場合
    --------------------------------------- */

    else {


      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.getElementById(
        "photo1"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo2"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo3"
      ).classList.add(
        "hidden"
      );

    }


  </script>


</body>
</html>
