<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wedding Message</title>

  <style>

    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      color: #333;

      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      overflow: hidden;

      transition: background-color 0.5s ease;
    }


    /* =========================
       メイン画面
    ========================= */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;
    }


    /* =========================
       写真共通
    ========================= */

    .photo {

      position: absolute;

      display: block;

      width: auto;
      height: auto;

      max-width: 48%;
      max-height: 34%;

      object-fit: contain;

      border-radius: 6px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.15);

      z-index: 1;

      background: rgba(255,255,255,0.15);
    }


    /* =========================
       写真①
       左上・小さめ
    ========================= */

    .photo-1 {

      top: 5%;
      left: 4%;

      max-width: 43%;
      max-height: 30%;
    }


    /* =========================
       写真②
       右側・一番大きい
    ========================= */

    .photo-2 {

      top: 8%;
      right: 4%;

      max-width: 55%;
      max-height: 40%;

      z-index: 2;
    }


    /* =========================
       写真③
       下側
    ========================= */

    .photo-3 {

      bottom: 5%;
      left: 10%;

      max-width: 48%;
      max-height: 30%;

      z-index: 1;
    }


    /* =========================
       中央メッセージカード
    ========================= */

    .message-card {

      position: absolute;

      width: 76%;
      max-width: 450px;

      height: auto;
      max-height: 48%;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 30px 25px;

      /*
        透明度高め。
        後ろの写真が少し透けて見える。
      */

      background: rgba(255, 255, 255, 0.68);

      border: 1px solid rgba(255,255,255,0.7);

      border-radius: 18px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      text-align: center;

      z-index: 10;

      overflow: hidden;
    }


    /* =========================
       名前
    ========================= */

    .name {

      margin: 0 0 16px;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        cursive;

      font-size: 27px;

      font-weight: 600;

      letter-spacing: 0.08em;

      color: #333;
    }


    /* =========================
       区切り線
    ========================= */

    .line {

      width: 42px;
      height: 1px;

      margin: 0 auto 18px;

      background: rgba(60,60,60,0.45);
    }


    /* =========================
       メッセージ部分
       長文の場合だけスクロール
    ========================= */

    .message-wrapper {

      max-height: 25vh;

      overflow-y: auto;

      padding-right: 5px;

      -webkit-overflow-scrolling: touch;
    }


    .message {

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        cursive;

      font-size: 15px;

      line-height: 2;

      letter-spacing: 0.04em;

      white-space: pre-line;

      color: #333;
    }


    /* =========================
       フッター
    ========================= */

    .footer {

      position: absolute;

      bottom: 1.5%;
      left: 0;

      width: 100%;

      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 10px;

      letter-spacing: 0.16em;

      color: rgba(60,60,60,0.65);

      z-index: 20;
    }


    /* =========================
       非表示
    ========================= */

    .hidden {
      display: none;
    }


    /* =========================
       小さいスマホ
    ========================= */

    @media (max-height: 700px) {

      .photo {
        max-height: 30%;
      }

      .photo-2 {
        max-height: 35%;
      }

      .message-card {

        width: 78%;

        padding: 22px 20px;

      }

      .name {

        font-size: 23px;

        margin-bottom: 12px;

      }

      .message-wrapper {

        max-height: 23vh;

      }

      .message {

        font-size: 13px;

        line-height: 1.8;

      }

    }


    /* =========================
       PC
    ========================= */

    @media (min-width: 700px) {

      .screen {

        height: 850px;

        margin-top: 20px;

        border-radius: 20px;

        box-shadow:
          0 10px 40px rgba(0,0,0,0.12);

      }

    }

  </style>
</head>


<body>

  <main class="screen">


    <!-- =====================
         写真
    ====================== -->

    <img
      id="photo1"
      class="photo photo-1"
      src=""
      alt="思い出の写真"
    >

    <img
      id="photo2"
      class="photo photo-2"
      src=""
      alt="思い出の写真"
    >

    <img
      id="photo3"
      class="photo photo-3"
      src=""
      alt="思い出の写真"
    >


    <!-- =====================
         中央メッセージ
    ====================== -->

    <section class="message-card">

      <h1
        id="name"
        class="name"
      >
        Thank you!
      </h1>


      <div class="line"></div>


      <div class="message-wrapper">

        <p
          id="message"
          class="message"
        >
          メッセージを読み込んでいます。
        </p>

      </div>

    </section>


    <!-- =====================
         フッター
    ====================== -->

    <div class="footer">

      THANK YOU FOR CELEBRATING WITH US

    </div>

  </main>


  <!-- =====================
       ゲストデータ
  ====================== -->

  <script src="guests.js"></script>


  <!-- =====================
       表示処理
  ====================== -->

  <script>

    /*
      URLからID取得
    */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get("id");


    /*
      背景色
      IDによって固定する
    */

    const backgroundColors = [

      "#F3E9E3",
      "#EDE8E2",
      "#E8ECE7",
      "#E8EDF2",
      "#F1E9D8",
      "#EEE7EF",
      "#E9E5DE",
      "#E7ECEB"

    ];


    /*
      IDから背景色を決定
    */

    function getBackgroundColor(id) {

      if (!id) {

        return backgroundColors[0];

      }

      let number = 0;

      for (let i = 0; i < id.length; i++) {

        number +=
          id.charCodeAt(i);

      }

      return backgroundColors[
        number % backgroundColors.length
      ];

    }


    document.body.style.backgroundColor =
      getBackgroundColor(id);


    /*
      写真を表示
    */

    function setPhoto(
      elementId,
      photoPath
    ) {

      const photo =
        document.getElementById(
          elementId
        );


      if (photoPath) {

        photo.src =
          photoPath;

        photo.classList.remove(
          "hidden"
        );

      } else {

        photo.classList.add(
          "hidden"
        );

      }

    }


    /*
      ゲストが存在する場合
    */

    if (
      id &&
      guests[id]
    ) {

      const guest =
        guests[id];


      /*
        名前
      */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /*
        メッセージ
      */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /*
        写真
      */

      setPhoto(
        "photo1",
        guest.photos[0]
      );


      setPhoto(
        "photo2",
        guest.photos[1]
      );


      setPhoto(
        "photo3",
        guest.photos[2]
      );


    } else {


      /*
        IDがない場合
      */

      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      /*
        写真を非表示
      */

      document.getElementById(
        "photo1"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo2"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "photo3"
      ).classList.add(
        "hidden"
      );

    }

  </script>

</body>
</html>
