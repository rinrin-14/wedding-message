<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Message</title>


  <!-- =====================================
       手書き風フォント
  ====================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
    rel="stylesheet"
  >


  <style>


    /* =====================================
       基本設定
    ===================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

    }


    body {

      overflow: hidden;

      color: #333;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        sans-serif;

      transition:
        background-color 0.6s ease;

    }


    /* =====================================
       全体
    ===================================== */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

    }


    /* =====================================
       写真エリア
    ===================================== */

    .photo-area {

      position: relative;

      width: 100%;

      height: 50%;

      overflow: hidden;

      background:
        rgba(255,255,255,0.12);

      touch-action: pan-y;

    }


    /* =====================================
       写真トラック
    ===================================== */

    .photo-track {

      position: absolute;

      top: 50%;

      left: 0;

      height: 82%;

      display: flex;

      align-items: center;

      gap: 20px;

      width: max-content;

      transform:
        translateY(-50%);

      will-change: transform;

      cursor: grab;

      user-select: none;

      -webkit-user-select: none;

    }


    .photo-track:active {

      cursor: grabbing;

    }


    /* =====================================
       写真カード

       枠・背景・影を全部なくす
    ===================================== */

    .photo-card {

      flex-shrink: 0;

      height: 100%;

      width: auto;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =====================================
       写真

       縦横比そのまま
    ===================================== */

    .photo-card img {

      display: block;

      height: 100%;

      width: auto;

      max-width: 62vw;

      object-fit: contain;

      border-radius: 5px;

      pointer-events: none;

      -webkit-user-drag: none;

    }


    /* =====================================
       写真なし
    ===================================== */

    .photo-card.hidden {

      display: none;

    }


    /* =====================================
       写真とメッセージの境目

       真っ二つに切らず、
       少しだけ柔らかくする
    ===================================== */

    .photo-area::after {

      content: "";

      position: absolute;

      left: 0;

      right: 0;

      bottom: 0;

      height: 45px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0.35)
        );

      pointer-events: none;

      z-index: 20;

    }


    /* =====================================
       メッセージエリア
    ===================================== */

    .message-area {

      position: relative;

      width: 100%;

      height: 50%;

      padding:
        25px 28px 16px;

      display: flex;

      flex-direction: column;

      align-items: stretch;

      /*
        背景はJSでゲストごとに変更
      */

      background:
        rgba(255,255,255,0.55);

      /*
        紙っぽい質感
      */

      background-image:

        radial-gradient(
          rgba(80,80,80,0.035) 0.6px,
          transparent 0.6px
        );

      background-size:
        7px 7px;

    }


    /* =====================================
       薄い装飾

       左上から葉っぱが
       ほんのり伸びているイメージ
    ===================================== */

    .message-area::before {

      content: "";

      position: absolute;

      width: 170px;

      height: 170px;

      top: -85px;

      right: -70px;

      border:

        1px solid
        rgba(90,100,85,0.08);

      border-radius:
        50% 40% 55% 45%;

      transform:
        rotate(25deg);

      pointer-events: none;

    }


    .message-area::after {

      content: "";

      position: absolute;

      width: 110px;

      height: 110px;

      bottom: -55px;

      left: -45px;

      border:

        1px solid
        rgba(90,100,85,0.07);

      border-radius:
        45% 55% 40% 60%;

      transform:
        rotate(-20deg);

      pointer-events: none;

    }


    /* =====================================
       宛名
    ===================================== */

    .name {

      position: relative;

      z-index: 2;

      flex-shrink: 0;

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 27px;

      font-weight: 600;

      letter-spacing: 0.08em;

      line-height: 1.5;

      text-align: left;

    }


    /* =====================================
       区切り線
    ===================================== */

    .line {

      position: relative;

      z-index: 2;

      width: 55px;

      height: 1px;

      margin:
        9px 0 15px;

      background:
        rgba(60,60,60,0.32);

    }


    /* =====================================
       メッセージスクロール部分
    ===================================== */

    .message-wrapper {

      position: relative;

      z-index: 2;

      width: 100%;

      max-width: 500px;

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        0 4px 0 0;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: none;

    }


    .message-wrapper::-webkit-scrollbar {

      display: none;

    }


    /* =====================================
       メッセージ本文
    ===================================== */

    .message {

      margin: 0;

      padding-bottom: 20px;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 16px;

      font-weight: 400;

      line-height: 2.05;

      letter-spacing: 0.045em;

      text-align: left;

      white-space: pre-line;

    }


    /* =====================================
       一番下の英字
       
       右寄せ
    ===================================== */

    .message-footer {

      position: relative;

      z-index: 2;

      flex-shrink: 0;

      margin-top: 7px;

      text-align: right;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 8px;

      letter-spacing: 0.16em;

      color:
        rgba(60,60,60,0.50);

    }


    /* =====================================
       小さいスマホ
    ===================================== */

    @media (max-height: 700px) {


      .photo-area {

        height: 50%;

      }


      .message-area {

        height: 50%;

        padding:
          19px 23px 13px;

      }


      .photo-track {

        height: 78%;

        gap: 15px;

      }


      .photo-card img {

        max-width: 65vw;

      }


      .name {

        font-size: 24px;

      }


      .line {

        margin:
          7px 0 12px;

      }


      .message {

        font-size: 14px;

        line-height: 1.9;

      }


      .message-footer {

        font-size: 7px;

      }

    }


    /* =====================================
       PC表示
    ===================================== */

    @media (min-width: 700px) {


      body {

        padding-top: 20px;

      }


      .screen {

        height: 850px;

        border-radius: 20px;

        overflow: hidden;

        box-shadow:
          0 10px 40px
          rgba(0,0,0,0.12);

      }

    }


  </style>

</head>


<body>


  <main class="screen">


    <!-- =================================
         写真エリア
    ================================== -->

    <section
      class="photo-area"
      id="photoArea"
    >


      <div
        class="photo-track"
        id="photoTrack"
      >


        <!-- 写真① -->

        <div
          class="photo-card"
          id="card1"
        >

          <img
            id="photo1"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真② -->

        <div
          class="photo-card"
          id="card2"
        >

          <img
            id="photo2"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真③ -->

        <div
          class="photo-card"
          id="card3"
        >

          <img
            id="photo3"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- =================================
             無限ループ用コピー
        ================================== -->

        <div
          class="photo-card"
          id="card1copy"
        >

          <img
            id="photo1copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card2copy"
        >

          <img
            id="photo2copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card3copy"
        >

          <img
            id="photo3copy"
            src=""
            alt=""
          >

        </div>


      </div>

    </section>


    <!-- =================================
         メッセージエリア
    ================================== -->

    <section
      class="message-area"
      id="messageArea"
    >


      <!-- 宛名 -->

      <h1
        id="name"
        class="name"
      >

        Thank you!

      </h1>


      <!-- 区切り -->

      <div class="line"></div>


      <!-- メッセージ -->

      <div
        class="message-wrapper"
        id="messageWrapper"
      >

        <p
          id="message"
          class="message"
        >

          メッセージを読み込んでいます。

        </p>

      </div>


      <!-- フッター -->

      <div class="message-footer">

        THANK YOU FOR CELEBRATING WITH US

      </div>


    </section>


  </main>


  <!-- =====================================
       ゲストデータ
  ====================================== -->

  <script src="guests.js"></script>


  <script>


    /* =====================================
       URLからID取得
    ===================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* =====================================
       背景色
    ===================================== */

    const backgroundColors = [

      "#F3E9DD",
      "#EEE9E1",
      "#E7EDE8",
      "#E8EDF1",
      "#F2E8D5",
      "#EEE7EE",
      "#E9E4DC",
      "#E5ECE9"

    ];


    function getBackgroundColor(id) {


      if (!id) {

        return backgroundColors[0];

      }


      let number = 0;


      for (
        let i = 0;
        i < id.length;
        i++
      ) {

        number +=
          id.charCodeAt(i);

      }


      return backgroundColors[
        number %
        backgroundColors.length
      ];

    }


    const guestBackground =
      getBackgroundColor(id);


    document.body.style.backgroundColor =
      guestBackground;


    /*
      メッセージエリアにも
      同じ色を薄く反映
    */

    document.getElementById(
      "messageArea"
    ).style.backgroundColor =
      guestBackground;


    /* =====================================
       写真セット関数
    ===================================== */

    function setPhoto(
      imageId,
      cardId,
      photoPath
    ) {


      const image =
        document.getElementById(
          imageId
        );


      const card =
        document.getElementById(
          cardId
        );


      if (photoPath) {

        image.src =
          photoPath;

        card.classList.remove(
          "hidden"
        );

      } else {

        card.classList.add(
          "hidden"
        );

      }

    }


    /* =====================================
       ゲスト情報
    ===================================== */

    if (
      id &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* 名前 */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* メッセージ */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* 写真① */

      setPhoto(
        "photo1",
        "card1",
        guest.photos[0]
      );


      /* 写真② */

      setPhoto(
        "photo2",
        "card2",
        guest.photos[1]
      );


      /* 写真③ */

      setPhoto(
        "photo3",
        "card3",
        guest.photos[2]
      );


      /* コピー① */

      setPhoto(
        "photo1copy",
        "card1copy",
        guest.photos[0]
      );


      /* コピー② */

      setPhoto(
        "photo2copy",
        "card2copy",
        guest.photos[1]
      );


      /* コピー③ */

      setPhoto(
        "photo3copy",
        "card3copy",
        guest.photos[2]
      );


    } else {


      /* =================================
         IDなし
      ================================== */

      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.querySelectorAll(
        ".photo-card"
      ).forEach(
        card => {

          card.classList.add(
            "hidden"
          );

        }
      );

    }


    /* =====================================
       写真スクロール
    ===================================== */

    const photoArea =
      document.getElementById(
        "photoArea"
      );


    const photoTrack =
      document.getElementById(
        "photoTrack"
      );


    let position = 0;

    /*
      自動スクロール速度
    */

    let velocity = 0.55;

    let isDragging = false;

    let startX = 0;

    let startPosition = 0;


    /* =====================================
       ループ幅
    ===================================== */

    function getLoopWidth() {


      const cards =
        photoTrack.querySelectorAll(
          ".photo-card"
        );


      if (cards.length < 6) {

        return 0;

      }


      return (
        cards[3].offsetLeft -
        cards[0].offsetLeft
      );

    }


    /* =====================================
       写真位置更新
    ===================================== */

    function updatePhotoPosition() {


      const loopWidth =
        getLoopWidth();


      if (!loopWidth) {

        return;

      }


      /*
        自動移動
      */

      if (!isDragging) {

        position -= velocity;

      }


      /*
        無限ループ
      */

      if (
        position <=
        -loopWidth
      ) {

        position +=
          loopWidth;

      }


      if (
        position > 0
      ) {

        position -=
          loopWidth;

      }


      photoTrack.style.transform =
        `translate3d(${position}px, -50%, 0)`;

    }


    /* =====================================
       アニメーション
    ===================================== */

    function animate() {


      updatePhotoPosition();


      requestAnimationFrame(
        animate
      );

    }


    requestAnimationFrame(
      animate
    );


    /* =====================================
       スマホ：タッチ開始
    ===================================== */

    photoArea.addEventListener(
      "touchstart",
      function(event) {


        if (
          event.touches.length !== 1
        ) {

          return;

        }


        isDragging = true;


        startX =
          event.touches[0].clientX;


        startPosition =
          position;

      },
      {
        passive: true
      }
    );


    /* =====================================
       スマホ：スワイプ
    ===================================== */

    photoArea.addEventListener(
      "touchmove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const deltaX =
          currentX - startX;


        position =
          startPosition + deltaX;


        const loopWidth =
          getLoopWidth();


        if (loopWidth) {


          if (
            position <=
            -loopWidth
          ) {

            position +=
              loopWidth;

            startPosition +=
              loopWidth;

          }


          if (
            position > 0
          ) {

            position -=
              loopWidth;

            startPosition -=
              loopWidth;

          }

        }


      },
      {
        passive: true
      }
    );


    /* =====================================
       スマホ：指を離す
    ===================================== */

    photoArea.addEventListener(
      "touchend",
      function() {

        isDragging = false;

      }
    );


    photoArea.addEventListener(
      "touchcancel",
      function() {

        isDragging = false;

      }
    );


    /* =====================================
       PC：マウス操作
    ===================================== */

    photoArea.addEventListener(
      "mousedown",
      function(event) {


        isDragging = true;


        startX =
          event.clientX;


        startPosition =
          position;

      }
    );


    window.addEventListener(
      "mousemove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const deltaX =
          event.clientX - startX;


        position =
          startPosition + deltaX;

      }
    );


    window.addEventListener(
      "mouseup",
      function() {

        isDragging = false;

      }
    );


  </script>


</body>
</html>
