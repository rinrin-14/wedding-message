<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wedding Message</title>


  <!-- ================================
       手書き風フォント
  ================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
    rel="stylesheet"
  >


  <style>


    /* =================================
       基本設定
    ================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      overflow: hidden;

    }


    body {

      background: #f7f5ef;

      color: #303030;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        sans-serif;

    }


    /* =================================
       全体
    ================================= */

    .screen {

      position: relative;

      width: 100%;
      height: 100dvh;

      max-width: 600px;

      margin: 0 auto;

      overflow: hidden;

      background: #f7f5ef;

    }


    /* =================================
       写真エリア
    ================================= */

    .photo-area {

      position: relative;

      width: 100%;

      height: 50%;

      overflow: hidden;

      background: #f7f5ef;

      touch-action: pan-y;

    }


    /* =================================
       フィルム穴
       
       写真ごとではなく
       エリア全体に連続して配置
    ================================= */

    .photo-area::before,
    .photo-area::after {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      height: 10px;

      z-index: 10;

      pointer-events: none;

      background-image:

        radial-gradient(
          ellipse at center,
          rgba(70,70,70,0.58) 0,
          rgba(70,70,70,0.58) 3px,
          transparent 3.6px
        );

      background-size:
        15px 10px;

      background-repeat:
        repeat-x;

    }


    /* 上のフィルム穴 */

    .photo-area::before {

      top: 12%;

    }


    /* 下のフィルム穴 */

    .photo-area::after {

      bottom: 12%;

    }


    /* =================================
       フィルムライン
    ================================= */

    .photo-area {

      border-bottom:
        1px solid rgba(50,50,50,0.12);

    }


    /* =================================
       写真トラック
    ================================= */

    .photo-track {

      position: absolute;

      top: 50%;
      left: 0;

      height: 76%;

      display: flex;

      align-items: center;

      gap: 28px;

      width: max-content;

      transform:
        translateY(-50%);

      will-change: transform;

      cursor: grab;

      user-select: none;

      -webkit-user-select: none;

      z-index: 5;

    }


    .photo-track:active {

      cursor: grabbing;

    }


    /* =================================
       写真カード
    ================================= */

    .photo-card {

      position: relative;

      flex-shrink: 0;

      height: 100%;

      width: auto;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .photo-card img {

      display: block;

      height: 100%;

      width: auto;

      max-width: 68vw;

      object-fit: contain;

      border-radius: 3px;

      pointer-events: none;

      -webkit-user-drag: none;

      box-shadow:
        0 4px 16px
        rgba(0,0,0,0.10);

    }


    .photo-card.hidden {

      display: none;

    }


    /* =================================
       写真エリアの薄い質感
    ================================= */

    .photo-area {

      background-image:

        radial-gradient(
          rgba(50,50,50,0.035) 0.6px,
          transparent 0.7px
        );

      background-size:
        6px 6px;

    }


    /* =================================
       メッセージエリア
    ================================= */

    .message-area {

      position: relative;

      width: 100%;

      height: 50%;

      padding:
        27px 28px 17px;

      display: flex;

      flex-direction: column;

      background:
        #f7f5ef;

      color:
        #303030;

      overflow: hidden;

    }


    /* =================================
       上部の境界線
    ================================= */

    .message-area::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 1px;

      background:
        rgba(50,50,50,0.13);

    }


    /* =================================
       下部の境界線
    ================================= */

    .message-area::after {

      content: "";

      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      height: 1px;

      background:
        rgba(50,50,50,0.10);

    }


    /* =================================
       メッセージエリア上部の
       小さなフィルム穴
    ================================= */

    .film-edge-top {

      position: absolute;

      top: 5px;
      left: 0;
      right: 0;

      height: 7px;

      background-image:

        radial-gradient(
          ellipse at center,
          rgba(70,70,70,0.45) 0,
          rgba(70,70,70,0.45) 2.5px,
          transparent 3px
        );

      background-size:
        15px 7px;

      background-repeat:
        repeat-x;

      opacity: 0.55;

      pointer-events: none;

    }


    /* =================================
       メッセージエリア下部の
       小さなフィルム穴
    ================================= */

    .film-edge-bottom {

      position: absolute;

      bottom: 5px;
      left: 0;
      right: 0;

      height: 7px;

      background-image:

        radial-gradient(
          ellipse at center,
          rgba(70,70,70,0.40) 0,
          rgba(70,70,70,0.40) 2.5px,
          transparent 3px
        );

      background-size:
        15px 7px;

      background-repeat:
        repeat-x;

      opacity: 0.45;

      pointer-events: none;

    }


    /* =================================
       宛名
    ================================= */

    .name {

      position: relative;

      z-index: 2;

      flex-shrink: 0;

      margin: 0;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      /* 前より小さく */

      font-size: 23px;

      font-weight: 600;

      letter-spacing:
        0.08em;

      line-height: 1.5;

      text-align: left;

      color:
        #303030;

    }


    /* =================================
       区切り線
    ================================= */

    .line {

      position: relative;

      z-index: 2;

      width: 55px;

      height: 1px;

      margin:
        8px 0 15px;

      background:
        rgba(48,48,48,0.45);

    }


    /* =================================
       メッセージスクロール領域
    ================================= */

    .message-wrapper {

      position: relative;

      z-index: 2;

      width: 100%;

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding-right: 5px;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width:
        none;

    }


    .message-wrapper::-webkit-scrollbar {

      display: none;

    }


    /* =================================
       メッセージ本文
    ================================= */

    .message {

      margin: 0;

      padding-bottom: 25px;

      font-family:
        "Klee One",
        "Hiragino Maru Gothic ProN",
        cursive;

      font-size: 16px;

      font-weight: 400;

      line-height: 2.05;

      letter-spacing:
        0.045em;

      text-align: left;

      white-space: pre-line;

      color:
        #383838;

    }


    /* =================================
       エンドロールっぽいライン
    ================================= */

    .credit-line {

      position: relative;

      z-index: 2;

      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 3px;

      margin-bottom: 8px;

      opacity: 0.42;

    }


    .credit-line span {

      display: block;

      height: 1px;

      background:
        #303030;

    }


    .credit-line span:first-child {

      width: 24px;

    }


    .credit-line span:last-child {

      width: 70px;

    }


    /* =================================
       一番下
    ================================= */

    .message-footer {

      position: relative;

      z-index: 2;

      flex-shrink: 0;

      margin-top: 4px;

      text-align: right;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 8px;

      letter-spacing:
        0.16em;

      color:
        rgba(48,48,48,0.55);

    }


    /* =================================
       小さいスマホ
    ================================= */

    @media (max-height: 700px) {


      .message-area {

        padding:
          20px 23px 14px;

      }


      .photo-track {

        height: 75%;

        gap: 22px;

      }


      .photo-card img {

        max-width: 72vw;

      }


      .name {

        font-size: 21px;

      }


      .line {

        margin:
          7px 0 12px;

      }


      .message {

        font-size: 14px;

        line-height: 1.9;

      }


      .message-footer {

        font-size: 7px;

      }

    }


    /* =================================
       PC
    ================================= */

    @media (min-width: 700px) {


      body {

        padding-top: 20px;

      }


      .screen {

        height: 850px;

        border-radius:
          20px;

        box-shadow:
          0 10px 40px
          rgba(0,0,0,0.12);

      }

    }


  </style>

</head>


<body>


  <main class="screen">


    <!-- =================================
         写真エリア
    ================================== -->

    <section
      class="photo-area"
      id="photoArea"
    >


      <div
        class="photo-track"
        id="photoTrack"
      >


        <!-- 写真① -->

        <div
          class="photo-card"
          id="card1"
        >

          <img
            id="photo1"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真② -->

        <div
          class="photo-card"
          id="card2"
        >

          <img
            id="photo2"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- 写真③ -->

        <div
          class="photo-card"
          id="card3"
        >

          <img
            id="photo3"
            src=""
            alt="思い出の写真"
          >

        </div>


        <!-- =================================
             無限スクロール用コピー
        ================================== -->

        <div
          class="photo-card"
          id="card1copy"
        >

          <img
            id="photo1copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card2copy"
        >

          <img
            id="photo2copy"
            src=""
            alt=""
          >

        </div>


        <div
          class="photo-card"
          id="card3copy"
        >

          <img
            id="photo3copy"
            src=""
            alt=""
          >

        </div>


      </div>

    </section>


    <!-- =================================
         メッセージエリア
    ================================== -->

    <section
      class="message-area"
      id="messageArea"
    >


      <!-- フィルム穴 -->

      <div
        class="film-edge-top"
      ></div>


      <!-- 宛名 -->

      <h1
        id="name"
        class="name"
      >

        Thank you!

      </h1>


      <!-- 区切り -->

      <div class="line"></div>


      <!-- メッセージ -->

      <div
        class="message-wrapper"
        id="messageWrapper"
      >

        <p
          id="message"
          class="message"
        >

          メッセージを読み込んでいます。

        </p>

      </div>


      <!-- エンドロール風ライン -->

      <div class="credit-line">

        <span></span>

        <span></span>

      </div>


      <!-- フッター -->

      <div class="message-footer">

        THANK YOU FOR CELEBRATING WITH US

      </div>


      <!-- 下側フィルム穴 -->

      <div
        class="film-edge-bottom"
      ></div>


    </section>


  </main>


  <!-- =====================================
       ゲストデータ
  ====================================== -->

  <script src="guests.js"></script>


  <script>


    /* =====================================
       URLからID取得
    ===================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    /* =====================================
       写真設定
    ===================================== */

    function setPhoto(
      imageId,
      cardId,
      photoPath
    ) {


      const image =
        document.getElementById(
          imageId
        );


      const card =
        document.getElementById(
          cardId
        );


      if (photoPath) {

        image.src =
          photoPath;

        card.classList.remove(
          "hidden"
        );

      } else {

        card.classList.add(
          "hidden"
        );

      }

    }


    /* =====================================
       ゲスト情報
    ===================================== */

    if (
      id &&
      guests[id]
    ) {


      const guest =
        guests[id];


      /* 名前 */

      document.getElementById(
        "name"
      ).textContent =
        `${guest.name}へ`;


      /* メッセージ */

      document.getElementById(
        "message"
      ).textContent =
        guest.message;


      /* 写真① */

      setPhoto(
        "photo1",
        "card1",
        guest.photos[0]
      );


      /* 写真② */

      setPhoto(
        "photo2",
        "card2",
        guest.photos[1]
      );


      /* 写真③ */

      setPhoto(
        "photo3",
        "card3",
        guest.photos[2]
      );


      /* コピー① */

      setPhoto(
        "photo1copy",
        "card1copy",
        guest.photos[0]
      );


      /* コピー② */

      setPhoto(
        "photo2copy",
        "card2copy",
        guest.photos[1]
      );


      /* コピー③ */

      setPhoto(
        "photo3copy",
        "card3copy",
        guest.photos[2]
      );


    } else {


      document.getElementById(
        "name"
      ).textContent =
        "Welcome!";


      document.getElementById(
        "message"
      ).textContent =
        "QRコードからアクセスしてください。";


      document.querySelectorAll(
        ".photo-card"
      ).forEach(
        card => {

          card.classList.add(
            "hidden"
          );

        }
      );

    }


    /* =====================================
       写真スクロール
    ===================================== */

    const photoArea =
      document.getElementById(
        "photoArea"
      );


    const photoTrack =
      document.getElementById(
        "photoTrack"
      );


    let position = 0;


    /*
      自動スクロール速度
    */

    const velocity = 0.55;


    let isDragging = false;

    let startX = 0;

    let startPosition = 0;


    /* =====================================
       無限ループ幅
    ===================================== */

    function getLoopWidth() {


      const cards =
        photoTrack.querySelectorAll(
          ".photo-card"
        );


      if (cards.length < 6) {

        return 0;

      }


      return (
        cards[3].offsetLeft -
        cards[0].offsetLeft
      );

    }


    /* =====================================
       写真位置更新
    ===================================== */

    function updatePhotoPosition() {


      const loopWidth =
        getLoopWidth();


      if (!loopWidth) {

        return;

      }


      if (!isDragging) {

        position -= velocity;

      }


      if (
        position <=
        -loopWidth
      ) {

        position +=
          loopWidth;

      }


      if (
        position > 0
      ) {

        position -=
          loopWidth;

      }


      photoTrack.style.transform =
        `translate3d(
          ${position}px,
          -50%,
          0
        )`;

    }


    /* =====================================
       アニメーション
    ===================================== */

    function animate() {

      updatePhotoPosition();

      requestAnimationFrame(
        animate
      );

    }


    requestAnimationFrame(
      animate
    );


    /* =====================================
       スマホ：タッチ開始
    ===================================== */

    photoArea.addEventListener(
      "touchstart",
      function(event) {


        if (
          event.touches.length !== 1
        ) {

          return;

        }


        isDragging = true;


        startX =
          event.touches[0].clientX;


        startPosition =
          position;

      },
      {
        passive: true
      }
    );


    /* =====================================
       スマホ：スワイプ
    ===================================== */

    photoArea.addEventListener(
      "touchmove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const currentX =
          event.touches[0].clientX;


        const deltaX =
          currentX - startX;


        position =
          startPosition +
          deltaX;


        const loopWidth =
          getLoopWidth();


        if (loopWidth) {


          if (
            position <=
            -loopWidth
          ) {

            position +=
              loopWidth;

            startPosition +=
              loopWidth;

          }


          if (
            position > 0
          ) {

            position -=
              loopWidth;

            startPosition -=
              loopWidth;

          }

        }


      },
      {
        passive: true
      }
    );


    /* =====================================
       スマホ：指を離す
    ===================================== */

    photoArea.addEventListener(
      "touchend",
      function() {

        isDragging = false;

      }
    );


    photoArea.addEventListener(
      "touchcancel",
      function() {

        isDragging = false;

      }
    );


    /* =====================================
       PC：マウス操作
    ===================================== */

    photoArea.addEventListener(
      "mousedown",
      function(event) {


        isDragging = true;


        startX =
          event.clientX;


        startPosition =
          position;

      }
    );


    window.addEventListener(
      "mousemove",
      function(event) {


        if (!isDragging) {

          return;

        }


        const deltaX =
          event.clientX -
          startX;


        position =
          startPosition +
          deltaX;

      }
    );


    window.addEventListener(
      "mouseup",
      function() {

        isDragging = false;

      }
    );


  </script>


</body>

</html>
