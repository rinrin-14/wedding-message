<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Wedding Message</title>

  <style>

    /* =========================
       全体
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f8f7f2;
      color: #333333;
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "Noto Serif JP",
        serif;
      overflow-x: hidden;
    }


    /* =========================
       ページ全体
    ========================= */

    .page {
      width: 100%;
      min-height: 100vh;
      background: #f8f7f2;
    }


    /* =========================
       PHOTO / FILM AREA
    ========================= */

    .photo-section {
      position: relative;

      height: 47vh;
      min-height: 390px;
      max-height: 560px;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 7px 7px;

      background-color: #252525;

      overflow: hidden;

      border-bottom: 1px solid rgba(0,0,0,0.15);
    }


    /* =========================
       フィルム上下の帯
    ========================= */

    .film-strip {
      position: absolute;
      left: 0;
      width: 100%;
      height: 52px;

      display: flex;
      align-items: center;

      overflow: hidden;

      z-index: 5;

      background: #252525;
    }

    .film-strip.top {
      top: 0;
    }

    .film-strip.bottom {
      bottom: 0;
    }


    /* フィルム穴 */

    .film-holes {
      width: 100%;

      display: flex;
      justify-content: space-around;
      align-items: center;

      padding: 0 8px;
    }

    .film-hole {
      width: 24px;
      height: 15px;

      background: #f8f7f2;

      border-radius: 3px;

      flex-shrink: 0;
    }


    /* =========================
       フィルム内側ライン
    ========================= */

    .film-line {
      position: absolute;
      left: 20px;
      right: 20px;

      height: 1px;

      background: rgba(248,247,242,0.28);

      z-index: 6;
    }

    .film-line.top-line {
      top: 51px;
    }

    .film-line.bottom-line {
      bottom: 51px;
    }


    /* =========================
       写真スライダー
    ========================= */

    .photo-track {
      position: absolute;

      top: 52px;
      bottom: 52px;

      left: 0;

      display: flex;
      align-items: center;

      gap: 32px;

      width: max-content;

      animation: filmMove 24s linear infinite;

      z-index: 2;

      will-change: transform;
    }


    /* 手動操作を可能にする */

    .photo-section {
      touch-action: pan-x;
    }


    /* =========================
       写真
    ========================= */

    .photo-frame {
      height: calc(47vh - 104px);

      min-height: 280px;
      max-height: 450px;

      width: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      background: transparent;

      overflow: hidden;
    }


    .photo-frame img {
      display: block;

      height: 100%;
      width: auto;

      max-width: 78vw;

      object-fit: contain;

      border-radius: 2px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.22);

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       写真スクロール
    ========================= */

    @keyframes filmMove {

      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }

    }


    /* =========================
       メッセージエリア
    ========================= */

    .message-section {
      position: relative;

      min-height: 53vh;

      padding:
        30px
        28px
        24px;

      background: #f8f7f2;

      overflow: hidden;
    }


    /* =========================
       上部のフィルムライン
    ========================= */

    .message-top-film {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 15px;

      border-top: 2px solid #d8d5cb;
      border-bottom: 1px solid #e3e0d7;

      background:
        radial-gradient(
          ellipse,
          #c9c6bd 45%,
          transparent 50%
        );

      background-size: 25px 8px;
      background-position: center;
      background-repeat: repeat-x;

      opacity: 0.85;
    }


    /* =========================
       チケット外枠
    ========================= */

    .ticket {
      position: relative;

      width: 100%;
      max-width: 720px;

      margin: 0 auto;

      padding:
        28px
        34px
        22px;

      border: 1px solid #bdb7a8;

      background: rgba(255,255,255,0.35);

      overflow: hidden;
    }


    /* 内側の細いライン */

    .ticket::before {
      content: "";

      position: absolute;

      top: 9px;
      left: 9px;
      right: 9px;
      bottom: 9px;

      border: 1px solid #d4cec1;

      pointer-events: none;
    }


    /* =========================
       上部装飾
    ========================= */

    .ticket-header {
      position: relative;

      text-align: center;

      height: 20px;

      margin-bottom: 2px;
    }

    .ticket-header::before,
    .ticket-header::after {
      content: "";

      position: absolute;

      top: 50%;

      width: 27%;

      height: 1px;

      background: #c3bbaa;
    }

    .ticket-header::before {
      left: 6%;
    }

    .ticket-header::after {
      right: 6%;
    }


    .diamond {
      position: relative;

      display: inline-block;

      width: 10px;
      height: 10px;

      background: #b8ad99;

      transform: rotate(45deg);

      z-index: 2;
    }


    /* =========================
       宛名
    ========================= */

    .guest-name {
      position: relative;

      margin:
        12px
        0
        8px;

      padding-left: 4px;

      font-size: clamp(25px, 7vw, 38px);

      font-weight: 400;

      letter-spacing: 0.08em;

      color: #333333;

      line-height: 1.35;
    }


    /* 宛名下ライン */

    .name-line {
      width: 95px;
      height: 2px;

      background: #a9a295;

      margin-left: 4px;
      margin-bottom: 20px;
    }


    /* =========================
       メッセージ本文
    ========================= */

    .message-box {
      position: relative;

      width: 100%;

      max-height: 285px;

      overflow-y: auto;

      padding:
        0
        4px;

      scrollbar-width: thin;

      scrollbar-color:
        #c7c1b5
        transparent;
    }


    /* iPhoneなどでのスクロール */

    .message-box {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }


    /* スクロールバー */

    .message-box::-webkit-scrollbar {
      width: 4px;
    }

    .message-box::-webkit-scrollbar-track {
      background: transparent;
    }

    .message-box::-webkit-scrollbar-thumb {
      background: #c7c1b5;
      border-radius: 10px;
    }


    .message {
      font-size: clamp(17px, 4.3vw, 22px);

      line-height: 2.05;

      letter-spacing: 0.055em;

      color: #414141;

      white-space: pre-wrap;

      padding-right: 6px;
    }


    /* =========================
       チケット下部
    ========================= */

    .ticket-footer {
      position: relative;

      display: flex;

      justify-content: space-between;
      align-items: flex-end;

      margin-top: 17px;

      padding:
        0
        4px;

      color: #817a6e;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      letter-spacing: 0.16em;

      font-size: 10px;

      line-height: 1.5;
    }


    .footer-left {
      text-align: left;
    }

    .footer-right {
      text-align: right;
    }


    /* ハート */

    .heart {
      position: absolute;

      left: 50%;
      bottom: 2px;

      transform: translateX(-50%);

      color: #9d927e;

      font-size: 16px;
    }


    /* =========================
       チケット下の切れ込み
    ========================= */

    .ticket-notch {
      position: absolute;

      width: 30px;
      height: 30px;

      border: 1px solid #bdb7a8;

      border-radius: 50%;

      background: #f8f7f2;

      z-index: 4;
    }

    .ticket-notch.left {
      left: -16px;
      top: 50%;

      transform: translateY(-50%);
    }

    .ticket-notch.right {
      right: -16px;
      top: 50%;

      transform: translateY(-50%);
    }


    /* =========================
       小さな装飾
    ========================= */

    .bottom-decoration {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      margin-top: 12px;

      opacity: 0.7;
    }

    .bottom-decoration::before,
    .bottom-decoration::after {
      content: "";

      width: 55px;
      height: 1px;

      background: #bdb7a8;
    }


    /* =========================
       スマホ調整
    ========================= */

    @media (max-width: 600px) {

      .photo-section {
        height: 47vh;
        min-height: 390px;
      }

      .film-strip {
        height: 48px;
      }

      .film-hole {
        width: 22px;
        height: 14px;
      }

      .photo-track {
        top: 48px;
        bottom: 48px;

        gap: 24px;
      }

      .photo-frame {
        height: calc(47vh - 96px);
        min-height: 290px;
      }

      .message-section {
        min-height: 53vh;

        padding:
          25px
          18px
          20px;
      }

      .ticket {
        padding:
          25px
          22px
          20px;
      }

      .guest-name {
        font-size: 28px;
      }

      .message-box {
        max-height: 320px;
      }

      .message {
        font-size: 17px;
        line-height: 2.05;
        letter-spacing: 0.045em;
      }

      .ticket-footer {
        font-size: 9px;
      }

    }


    /* =========================
       長文時
    ========================= */

    @media (min-height: 800px) {

      .message-box {
        max-height: 350px;
      }

    }


    /* =========================
       動きを減らしたい端末
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      .photo-track {
        animation: none;
      }

    }

  </style>

</head>


<body>

<div class="page">


  <!-- =========================
       PHOTO SECTION
  ========================== -->

  <section class="photo-section" id="photoSection">


    <!-- 上フィルム -->

    <div class="film-strip top">

      <div class="film-holes">

        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>

      </div>

    </div>


    <!-- 下フィルム -->

    <div class="film-strip bottom">

      <div class="film-holes">

        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>
        <span class="film-hole"></span>

      </div>

    </div>


    <div class="film-line top-line"></div>
    <div class="film-line bottom-line"></div>


    <!-- 写真 -->

    <div class="photo-track" id="photoTrack">

      <!-- JavaScriptで写真を追加 -->

    </div>

  </section>



  <!-- =========================
       MESSAGE SECTION
  ========================== -->

  <section class="message-section">


    <div class="message-top-film"></div>


    <div class="ticket">


      <!-- 上部装飾 -->

      <div class="ticket-header">

        <span class="diamond"></span>

      </div>


      <!-- 宛名 -->

      <h1
        class="guest-name"
        id="name">
        Welcome!
      </h1>


      <div class="name-line"></div>


      <!-- メッセージ -->

      <div
        class="message-box"
        id="messageBox">

        <div
          class="message"
          id="message">
          メッセージを読み込んでいます。
        </div>

      </div>


      <!-- 下部 -->

      <div class="ticket-footer">

        <div class="footer-left">
          RIN &amp; RIN<br>
          WEDDING
        </div>

        <div class="footer-right">
          THANK YOU FOR<br>
          CELEBRATING WITH US
        </div>

        <div class="heart">
          ♥
        </div>

      </div>


      <!-- 左右の切れ込み -->

      <div class="ticket-notch left"></div>
      <div class="ticket-notch right"></div>


    </div>


    <div class="bottom-decoration"></div>


  </section>

</div>



<!-- =========================
     ゲストデータ
========================== -->

<script src="guests.js"></script>


<script>

  /* =========================
     URLからID取得
  ========================== */

  const params =
    new URLSearchParams(window.location.search);

  const id =
    params.get("id");


  /* =========================
     ゲスト情報
  ========================== */

  if (id && typeof guests !== "undefined" && guests[id]) {

    const guest = guests[id];


    /* 名前 */

    document.getElementById("name").textContent =
      `${guest.name}さんへ`;


    /* メッセージ */

    document.getElementById("message").textContent =
      guest.message;


    /* =========================
       写真
    ========================== */

    const track =
      document.getElementById("photoTrack");


    const photos =
      guest.photos || [];


    if (photos.length > 0) {

      /*
       * 写真を2セット並べることで
       * 無限スクロールっぽく見せる
       */

      const photoList =
        [...photos, ...photos];


      photoList.forEach((photo, index) => {

        const frame =
          document.createElement("div");

        frame.className =
          "photo-frame";


        const img =
          document.createElement("img");

        img.src =
          photo;

        img.alt =
          `${guest.name}さんとの思い出`;

        img.draggable = false;


        frame.appendChild(img);

        track.appendChild(frame);

      });

    }


  } else {


    /* =========================
       IDがない場合
    ========================== */

    document.getElementById("name").textContent =
      "Welcome!";


    document.getElementById("message").textContent =
      "QRコードからアクセスしてください。";

  }



  /* =========================
     写真の手動スワイプ
  ========================== */

  const photoSection =
    document.getElementById("photoSection");

  const photoTrack =
    document.getElementById("photoTrack");


  let startX = 0;
  let currentX = 0;
  let dragging = false;


  photoSection.addEventListener(
    "touchstart",
    (e) => {

      startX =
        e.touches[0].clientX;

      dragging = true;

      photoTrack.style.animationPlayState =
        "paused";

    },
    { passive: true }
  );


  photoSection.addEventListener(
    "touchmove",
    (e) => {

      if (!dragging) return;

      currentX =
        e.touches[0].clientX;

      const diff =
        currentX - startX;

      photoTrack.style.transform =
        `translateX(${diff}px)`;

    },
    { passive: true }
  );


  photoSection.addEventListener(
    "touchend",
    () => {

      dragging = false;

      photoTrack.style.transform = "";

      photoTrack.style.animationPlayState =
        "running";

    }
  );


</script>


</body>
</html>
